<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file: 'unsafe-inline' blob:; style-src 'self' file: 'unsafe-inline' blob:; img-src blob: data:; font-src blob: data:; frame-src 'self' blob:; object-src blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Winigen Materials — Website Review</title><link rel="stylesheet" href="review.css"></head>
<body><nav class="review-bar" aria-label="Website review controls"><span>Winigen Materials · Website Review Preview</span><button id="home">Home</button><button id="feedback">Feedback</button><button id="help">Help</button></nav>
<p id="loading" role="status">Opening the offline website…</p>
<iframe id="website" title="Winigen Materials offline website" sandbox="allow-scripts allow-same-origin allow-downloads allow-popups"></iframe>
<dialog id="notice"><p></p><button>OK</button></dialog>
<dialog id="document-view"><header><strong>Public technical document</strong><a download>Download PDF</a><button type="button">Close</button></header><iframe title="Public technical document"></iframe><p>If your browser does not display this PDF, use Download PDF.</p></dialog>
<dialog id="notes"><form method="dialog"><h1>Your review notes</h1><label>Page<input id="note-page" readonly></label><label>What looks good, or could be improved?<textarea id="note-text" rows="7"></textarea></label><p>Notes stay on this computer. Download them to share when ready.</p><button type="button" id="download-notes">Download notes</button><button>Close</button></form></dialog>
<script src="review-data.js"></script><script src="review.js"></script></body></html>
