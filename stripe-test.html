<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#12305d">
  <title>Stripe Test Checkout | Winigen Materials</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css?v=c605a723f01a">
  <style>
    .stripe-test-main { min-height: 100vh; display: grid; place-items: center; padding: 48px 0; }
    .stripe-test-panel { width: min(600px, 92vw); text-align: center; }
    .stripe-test-panel h1 { font-size: clamp(34px, 5vw, 52px); }
    .stripe-test-panel .eyebrow { margin-bottom: 18px; }
    .stripe-test-status { min-height: 1.5em; margin-top: 18px; font-weight: 700; }
    .stripe-test-status.is-error { color: #b42318; }
    .stripe-test-note { font-size: 14px; }
  </style>
</head>
<body>
  <main class="stripe-test-main">
    <section class="card stripe-test-panel" aria-labelledby="stripe-test-title">
      <div class="eyebrow">Development Only</div>
      <h1 id="stripe-test-title">Catalog Checkout Testing</h1>
      <p>The standalone development item has been retired. Stripe sandbox testing now uses server-validated products and package prices from the Winigen catalog.</p>
      <a class="btn" href="products.html">Open Product Catalog</a>
      <p class="stripe-test-note">Development environment only. Orders remain pending fulfillment review.</p>
    </section>
  </main>
</body>
</html>
