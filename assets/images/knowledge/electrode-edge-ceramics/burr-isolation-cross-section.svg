<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="t d"><title id="t">A conductive edge defect reduces local separation margin; coverage adds an insulating barrier</title><desc id="d">Original conceptual engineering schematic. Geometry and microstructure are not to scale; no numerical performance is implied.</desc><defs><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#dbe3ec"/><stop offset=".48" stop-color="#8b9cac"/><stop offset="1" stop-color="#cad4df"/></linearGradient><linearGradient id="liquid" x2="0" y2="1"><stop stop-color="#edf5fc"/><stop offset="1" stop-color="#c5dbee"/></linearGradient><pattern id="active" width="36" height="28" patternUnits="userSpaceOnUse"><rect width="36" height="28" fill="#35465b"/><circle cx="7" cy="9" r="7" fill="#4a5b6d"/><circle cx="27" cy="22" r="8" fill="#263c52"/></pattern><pattern id="ceramic" width="29" height="22" patternUnits="userSpaceOnUse"><rect width="29" height="22" fill="#9fbce0"/><path d="M3 5l9-3 5 7-6 7-8-3z M20 15l6-4 2 8-5 2z" fill="#d4e2f2" stroke="#658fc5" stroke-width="1"/></pattern><pattern id="pores" width="42" height="30" patternUnits="userSpaceOnUse"><rect width="42" height="30" fill="#e0e6eb"/><path d="M2 7Q12 20 20 7T40 9M2 27Q13 10 22 27T41 22" fill="none" stroke="#fff" stroke-width="7"/></pattern><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7" fill="#3277ba"/></marker></defs><rect width="1400" height="780" fill="#fff"/><text x="50" y="58" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#142d50" font-weight="700">A  Exposed vulnerable region</text><rect x="65" y="130" width="570" height="55" rx="0" fill="url(#active)" stroke="none" stroke-width="2"/><text x="70" y="113" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#142d50" font-weight="400">Opposite electrode</text><rect x="65" y="252" width="570" height="40" rx="0" fill="url(#pores)" stroke="#bdc9d5" stroke-width="2"/><text x="70" y="237" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#142d50" font-weight="400">Separator</text><rect x="65" y="430" width="325" height="70" rx="0" fill="url(#active)" stroke="none" stroke-width="2"/><rect x="65" y="500" width="550" height="17" rx="0" fill="url(#metal)" stroke="none" stroke-width="2"/><path d="M430 500L450 330Q460 317 464 335L480 500Z" fill="url(#metal)" stroke="#617184" stroke-width="2"/><line x1="453" y1="300" x2="453" y2="322" stroke="#c58242" stroke-width="3"/><line x1="440" y1="300" x2="466" y2="300" stroke="#c58242" stroke-width="2"/><line x1="440" y1="322" x2="466" y2="322" stroke="#c58242" stroke-width="2"/><text x="270" y="372" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#c58242" font-weight="400">Reduced local margin</text><line x1="278" y1="346" x2="450" y2="311" stroke="#c58242" stroke-width="1.5"/><text x="300" y="581" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#142d50" font-weight="400">Conductive burr</text><line x1="308" y1="555" x2="455" y2="400" stroke="#142d50" stroke-width="1.5"/><text x="68" y="656" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#617184" font-weight="400">Coverage, separator condition and registration act together.</text><text x="750" y="58" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#142d50" font-weight="700">B  Intact insulating coverage</text><rect x="765" y="130" width="570" height="55" rx="0" fill="url(#active)" stroke="none" stroke-width="2"/><text x="770" y="113" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#142d50" font-weight="400">Opposite electrode</text><rect x="765" y="252" width="570" height="40" rx="0" fill="url(#pores)" stroke="#bdc9d5" stroke-width="2"/><text x="770" y="237" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#142d50" font-weight="400">Separator</text><rect x="765" y="430" width="325" height="70" rx="0" fill="url(#active)" stroke="none" stroke-width="2"/><rect x="765" y="500" width="550" height="17" rx="0" fill="url(#metal)" stroke="none" stroke-width="2"/><path d="M1130 500L1150 330Q1160 317 1164 335L1180 500Z" fill="url(#metal)" stroke="#617184" stroke-width="2"/><path d="M1052 430L1104 430L1136 326Q1159 296 1180 327L1198 463L1290 463L1290 500L1052 500Z" fill="url(#ceramic)" stroke="#3277ba" stroke-width="2"/><path d="M1130 500L1150 330Q1160 317 1164 335L1180 500" fill="none" stroke="#617184" stroke-width="1.5" stroke-dasharray="4 4"/><text x="992" y="587" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#142d50" font-weight="400">Continuous ceramic / binder film</text><line x1="1000" y1="561" x2="1205" y2="475" stroke="#142d50" stroke-width="1.5"/><text x="768" y="656" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#617184" font-weight="400">Coverage, separator condition and registration act together.</text><line x1="45" y1="725" x2="1355" y2="725" stroke="#dce4ed" stroke-width="1"/><text x="45" y="756" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#617184" font-weight="400">Potential pathway, not inevitable contact. Burr size and layer thickness are exaggerated to expose the mechanism.</text></svg>