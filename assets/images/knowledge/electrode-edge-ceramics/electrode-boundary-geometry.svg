<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" role="img" aria-labelledby="t d"><title id="t">Electrode plan view and cross-section distinguish three boundaries</title><desc id="d">Original conceptual engineering schematic. Geometry and microstructure are not to scale; no numerical performance is implied.</desc><defs><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#dbe3ec"/><stop offset=".48" stop-color="#8b9cac"/><stop offset="1" stop-color="#cad4df"/></linearGradient><linearGradient id="liquid" x2="0" y2="1"><stop stop-color="#edf5fc"/><stop offset="1" stop-color="#c5dbee"/></linearGradient><pattern id="active" width="36" height="28" patternUnits="userSpaceOnUse"><rect width="36" height="28" fill="#35465b"/><circle cx="7" cy="9" r="7" fill="#4a5b6d"/><circle cx="27" cy="22" r="8" fill="#263c52"/></pattern><pattern id="ceramic" width="29" height="22" patternUnits="userSpaceOnUse"><rect width="29" height="22" fill="#9fbce0"/><path d="M3 5l9-3 5 7-6 7-8-3z M20 15l6-4 2 8-5 2z" fill="#d4e2f2" stroke="#658fc5" stroke-width="1"/></pattern><pattern id="pores" width="42" height="30" patternUnits="userSpaceOnUse"><rect width="42" height="30" fill="#e0e6eb"/><path d="M2 7Q12 20 20 7T40 9M2 27Q13 10 22 27T41 22" fill="none" stroke="#fff" stroke-width="7"/></pattern><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7" fill="#3277ba"/></marker></defs><rect width="1400" height="880" fill="#fff"/><text x="50" y="55" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#142d50" font-weight="700">A  Plan view • registration and retained cutting region</text><path d="M105 184L586 96 677 281 196 369Z" fill="#b4c4d6" stroke="#142d50" stroke-width="2"/><path d="M80 232L595 137 700 332 185 427Z" fill="url(#pores)" stroke="#94a8bc" stroke-width="2"/><path d="M95 309L558 224 665 420 202 505Z" fill="url(#metal)" stroke="#617184" stroke-width="2"/><path d="M95 309L429 248 536 444 202 505Z" fill="url(#active)" stroke="#142d50" stroke-width="2"/><path d="M402 253L466 241 573 437 509 449Z" fill="url(#ceramic)" stroke="#3277ba" stroke-width="2"/><path d="M445 242L552 444" fill="none" stroke="#c58242" stroke-width="2.5" stroke-dasharray="7 5"/><text x="55" y="610" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#142d50" font-weight="400">Cathode active coating</text><line x1="63" y1="584" x2="255" y2="428" stroke="#142d50" stroke-width="1.5"/><text x="358" y="664" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#142d50" font-weight="400">Insulating strip</text><line x1="366" y1="638" x2="523" y2="417" stroke="#142d50" stroke-width="1.5"/><text x="85" y="140" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#142d50" font-weight="400">Anode footprint</text><line x1="93" y1="150" x2="243" y2="165" stroke="#142d50" stroke-width="1.5"/><text x="52" y="557" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#142d50" font-weight="400">Separator overhang</text><line x1="60" y1="531" x2="174" y2="404" stroke="#142d50" stroke-width="1.5"/><text x="440" y="565" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#142d50" font-weight="400">Physical Al foil edge</text><line x1="448" y1="539" x2="653" y2="414" stroke="#142d50" stroke-width="1.5"/><text x="69" y="728" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#142d50" font-weight="400">Active boundary, insulating boundary and cut line</text><text x="69" y="760" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#142d50" font-weight="400">are separate geometric references.</text><text x="69" y="791" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#c58242" font-weight="400">Dashed plan line: example cut location</text><line x1="718" y1="85" x2="718" y2="770" stroke="#dce4ed" stroke-width="1"/><text x="764" y="55" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#142d50" font-weight="700">B  Local cross-section</text><rect x="789" y="180" width="529" height="55" rx="0" fill="url(#active)" stroke="none" stroke-width="2"/><text x="773" y="167" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#142d50" font-weight="400">Negative electrode</text><rect x="773" y="282" width="565" height="38" rx="0" fill="url(#pores)" stroke="#bdc9d5" stroke-width="2"/><rect x="773" y="384" width="405" height="66" rx="0" fill="url(#active)" stroke="none" stroke-width="2"/><rect x="773" y="450" width="523" height="17" rx="0" fill="url(#metal)" stroke="none" stroke-width="2"/><rect x="1143" y="378" width="132" height="72" rx="0" fill="url(#ceramic)" stroke="none" stroke-width="2"/><text x="775" y="336" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#142d50" font-weight="400">Separator</text><line x1="783" y1="310" x2="869" y2="296" stroke="#142d50" stroke-width="1.5"/><text x="796" y="524" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#142d50" font-weight="400">Active coating</text><line x1="804" y1="498" x2="919" y2="415" stroke="#142d50" stroke-width="1.5"/><text x="781" y="575" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#617184" font-weight="400">Al current collector</text><line x1="1178" y1="368" x2="1178" y2="536" stroke="#c58242" stroke-width="2" stroke-dasharray="6 5"/><text x="1000" y="567" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#c58242" font-weight="400">Active boundary</text><line x1="1008" y1="541" x2="1178" y2="536" stroke="#c58242" stroke-width="1.5"/><line x1="1275" y1="379" x2="1275" y2="596" stroke="#3277ba" stroke-width="2" stroke-dasharray="6 5"/><text x="1000" y="627" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#3277ba" font-weight="400">Insulating edge</text><line x1="1008" y1="601" x2="1275" y2="596" stroke="#3277ba" stroke-width="1.5"/><line x1="1296" y1="454" x2="1296" y2="650" stroke="#617184" stroke-width="1.5"/><text x="1000" y="681" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#617184" font-weight="400">Physical foil edge</text><line x1="1008" y1="655" x2="1296" y2="650" stroke="#617184" stroke-width="1.5"/><text x="780" y="730" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#142d50" font-weight="400">Margins are architecture-specific;</text><text x="780" y="762" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#142d50" font-weight="400">no universal overhang is implied.</text><line x1="45" y1="825" x2="1355" y2="825" stroke="#dce4ed" stroke-width="1"/><text x="45" y="856" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#617184" font-weight="400">Cathode-side example. Exploded plan view and enlarged section are conceptual, not dimensionally matched.</text></svg>