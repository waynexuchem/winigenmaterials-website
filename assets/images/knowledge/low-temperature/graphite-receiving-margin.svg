<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Local lithium-receiving margin through a porous graphite electrode</title>
  <desc id="desc">An illustrative electrolyte-limited cold-charge case shows graded lithiation activity through a porous graphite electrode, localized lithium deposition near the separator, a comparison of lithium arrival and accessible local insertion flux, and a second plot showing the resulting local receiving margin across zero.</desc>
  <metadata>Copyright © 2026 Winigen Materials. All rights reserved. Reproduction, modification, or redistribution requires permission.</metadata>
  <defs>
    <linearGradient id="pore" x1="0" x2="1"><stop stop-color="#6fcce0"/><stop offset=".45" stop-color="#9fcfe2"/><stop offset="1" stop-color="#dcecf2"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#ed7049"/></marker>
    <style>text{font-family:Inter,Arial,sans-serif}.h{fill:#14213d;font-size:30px;font-weight:800}.sub{fill:#5b6d88;font-size:17px}.lab{fill:#263a59;font-size:18px;font-weight:800}.small{fill:#5b6d88;font-size:14px}.white{fill:#fff}</style>
  </defs>
  <rect width="1200" height="820" rx="26" fill="#f4f7fb"/>
  <text x="58" y="58" class="h">Lithium plating becomes competitive when arrival exceeds graphite acceptance</text>
  <text x="58" y="88" class="sub">The safety-relevant margin varies through electrode thickness; average N/P and average current cannot reveal the first limiting region.</text>

  <g transform="translate(58 125)">
    <rect width="1084" height="350" rx="22" fill="#14213d"/>
    <text x="30" y="42" class="white" font-size="19" font-weight="800">Illustrative electrolyte-limited cold-charge case</text>
    <text x="30" y="68" fill="#bdd0eb" font-size="14.5">Li⁺ arrival and lithiation activity are concentrated near the separator-facing region</text>
    <g transform="translate(55 95)">
      <rect width="95" height="210" rx="15" fill="#c5dfed"/><path d="M27 16v178M64 16v178" stroke="#ecf9ff" stroke-width="13"/><text x="47" y="236" text-anchor="middle" fill="#bdd0eb" font-size="14.5">separator</text>
      <rect x="95" width="790" height="210" rx="6" fill="url(#pore)" opacity=".93"/>
      <rect x="885" width="28" height="210" fill="#c68f65"/><text x="899" y="236" text-anchor="middle" fill="#bdd0eb" font-size="14.5">Cu</text>
      <g fill="none" stroke="#ed7049">
        <circle cx="158" cy="48" r="43" stroke-width="10" opacity=".55"/><circle cx="185" cy="132" r="47" stroke-width="10" opacity=".55"/>
        <circle cx="245" cy="41" r="38" stroke-width="8" opacity=".34"/><circle cx="278" cy="137" r="39" stroke-width="8" opacity=".34"/>
        <circle cx="368" cy="51" r="40" stroke-width="6" opacity=".17"/><circle cx="380" cy="143" r="41" stroke-width="6" opacity=".17"/>
        <circle cx="460" cy="38" r="34" stroke-width="4" opacity=".08"/><circle cx="480" cy="132" r="43" stroke-width="4" opacity=".08"/>
      </g>
      <g fill="#242b35" stroke="#6f829e" stroke-width="4">
        <circle cx="158" cy="48" r="34"/><circle cx="245" cy="41" r="30"/><circle cx="185" cy="132" r="38"/><circle cx="278" cy="137" r="31"/>
        <circle cx="368" cy="51" r="34"/><circle cx="460" cy="38" r="29"/><circle cx="555" cy="53" r="36"/><circle cx="655" cy="43" r="31"/><circle cx="760" cy="52" r="36"/><circle cx="850" cy="42" r="28"/><circle cx="380" cy="143" r="35"/><circle cx="480" cy="132" r="38"/><circle cx="585" cy="142" r="32"/><circle cx="680" cy="136" r="36"/><circle cx="786" cy="141" r="34"/><circle cx="858" cy="145" r="26"/>
      </g>
      <g fill="#111823">
        <circle cx="220" cy="87" r="9"/><circle cx="320" cy="91" r="8"/><circle cx="420" cy="94" r="7"/><circle cx="520" cy="92" r="9"/>
        <circle cx="570" cy="96" r="7"/><circle cx="620" cy="95" r="7"/><circle cx="735" cy="95" r="8"/><circle cx="815" cy="95" r="7"/>
      </g>
      <g stroke="#111823" stroke-width="5">
        <path d="M220 87l25-20"/><path d="M320 91l27 20"/><path d="M420 94l-22-15"/><path d="M520 92l25-15"/>
        <path d="M570 96l20-17"/><path d="M620 95l23 17"/><path d="M815 95l-18 18"/>
      </g>
      <g stroke="#ed7049" stroke-width="6" marker-end="url(#a)"><path d="M25 48H135"/><path d="M25 105H155"/><path d="M25 165H142"/></g>
      <g fill="#ff9b7e"><circle cx="45" cy="48" r="8"/><circle cx="76" cy="48" r="8"/><circle cx="106" cy="48" r="8"/><circle cx="52" cy="105" r="8"/><circle cx="90" cy="105" r="8"/><circle cx="126" cy="105" r="8"/></g>
      <path d="M128 19L119 25L124 31L116 38L122 44L115 51L123 57L119 65L130 70L133 59L129 51L135 43L131 35L136 27Z" fill="#dce1e7" stroke="#ed7049" stroke-width="3" stroke-linejoin="round"/>
      <text x="160" y="-10" text-anchor="middle" fill="#ffb49f" font-size="15" font-weight="900">localized Li deposition</text>
      <text x="205" y="202" text-anchor="middle" fill="#30455f" font-size="14" font-weight="800">thin gray ring: SEI</text>
      <text x="465" y="202" text-anchor="middle" fill="#30455f" font-size="14" font-weight="800">orange halo: lithiation activity</text>
      <text x="725" y="202" text-anchor="middle" fill="#30455f" font-size="14" font-weight="800">black nodes / links: binder–carbon network</text>
    </g>
  </g>

  <g transform="translate(58 505)">
    <rect width="1084" height="250" rx="22" fill="#fff" stroke="#c6d4e7"/>
    <text x="25" y="32" class="lab">How local flux balance sets plating risk</text>
    <text x="1055" y="32" text-anchor="end" class="small">illustrative electrolyte-limited cold-charge case</text>
    <text x="25" y="58" class="small">Where lithium arrives faster than graphite can insert it, the local receiving margin becomes negative.</text>

    <!-- Arrival and accessible insertion flux -->
    <g transform="translate(65 90)">
      <text x="0" y="0" fill="#263a59" font-size="15.5" font-weight="850">Local fluxes</text>
      <line x1="0" y1="103" x2="420" y2="103" stroke="#8194b1" stroke-width="2"/>
      <line x1="0" y1="20" x2="0" y2="103" stroke="#8194b1" stroke-width="2"/>
      <path d="M0 28C75 30 138 38 205 62S330 84 420 92" fill="none" stroke="#ed7049" stroke-width="5"/>
      <path d="M0 70C72 65 140 70 205 62C260 53 325 59 420 48" fill="none" stroke="#2a66d9" stroke-width="5"/>
      <line x1="205" y1="18" x2="205" y2="103" stroke="#6d7f99" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="205" y="118" text-anchor="middle" fill="#536b87" font-size="12.5" font-weight="800">arrival = insertion</text>
      <text x="220" y="44" fill="#2a66d9" font-size="13.5" font-weight="900">Accessible local insertion flux</text>
      <text x="286" y="76" fill="#c55234" font-size="13.5" font-weight="900">Li⁺ arrival flux</text>
      <text x="0" y="130" class="small">separator-facing</text>
      <text x="420" y="130" text-anchor="end" class="small">collector-facing</text>
      <text transform="translate(-42 61) rotate(-90)" text-anchor="middle" class="small">local flux</text>
    </g>

    <!-- Receiving margin shown directly -->
    <g transform="translate(590 90)">
      <text x="0" y="0" fill="#263a59" font-size="15.5" font-weight="850">Local receiving margin, M<tspan baseline-shift="sub" font-size="11">Li</tspan>(x)</text>
      <line x1="0" y1="103" x2="420" y2="103" stroke="#8194b1" stroke-width="2"/>
      <line x1="0" y1="20" x2="0" y2="103" stroke="#8194b1" stroke-width="2"/>
      <line x1="0" y1="62" x2="420" y2="62" stroke="#6d7f99" stroke-width="2"/>
      <text x="-9" y="67" text-anchor="end" class="small">0</text>
      <path d="M0 96C85 95 155 90 205 62L0 62Z" fill="#ed7049" opacity=".2"/>
      <path d="M205 62C255 44 330 30 420 22L420 62Z" fill="#2a66d9" opacity=".18"/>
      <path d="M0 96C85 95 155 90 205 62" fill="none" stroke="#ed7049" stroke-width="5"/>
      <path d="M205 62C255 44 330 30 420 22" fill="none" stroke="#2a66d9" stroke-width="5"/>
      <line x1="205" y1="18" x2="205" y2="103" stroke="#6d7f99" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="63" y="75" text-anchor="middle" fill="#b54b31" font-size="12.5" font-weight="900">Negative margin</text>
      <text x="63" y="88" text-anchor="middle" fill="#b54b31" font-size="12.5" font-weight="900">plating competitive</text>
      <text x="352" y="49" text-anchor="middle" fill="#2a66d9" font-size="12.5" font-weight="900">Positive margin</text>
      <text x="352" y="61" text-anchor="middle" fill="#2a66d9" font-size="12.5" font-weight="900">insertion supported</text>
      <text x="205" y="118" text-anchor="middle" fill="#536b87" font-size="12.5" font-weight="800">first limiting position</text>
      <text x="0" y="130" class="small">separator-facing</text>
      <text x="420" y="130" text-anchor="end" class="small">collector-facing</text>
      <text transform="translate(-42 61) rotate(-90)" text-anchor="middle" class="small">M<tspan baseline-shift="sub" font-size="10">Li</tspan>(x)</text>
    </g>
  </g>
  <text x="58" y="803" class="small">Position of the crossing depends on temperature, SOC, current, loading, porosity, wetting, SEI resistance, active area, and aging.</text>
</svg>
