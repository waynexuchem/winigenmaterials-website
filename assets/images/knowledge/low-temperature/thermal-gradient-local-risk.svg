<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Thermal gradients and local electrochemical risk in a pouch cell</title>
  <desc id="desc">A pouch-cell stack with tabs, a surface sensor, illustrative internal temperature contours, current redistribution toward a warmer lower-resistance region, and the distinct charge and discharge consequences of a colder limiting region.</desc>
  <metadata>Copyright © 2026 Winigen Materials. All rights reserved. Reproduction, modification, or redistribution requires permission.</metadata>
  <defs>
    <radialGradient id="temp" cx=".18" cy=".2" r=".95"><stop stop-color="#f3a64b"/><stop offset=".35" stop-color="#82cbe0"/><stop offset="1" stop-color="#244c91"/></radialGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#ed7049"/></marker>
    <style>text{font-family:Inter,Arial,sans-serif}.h{fill:#14213d;font-size:30px;font-weight:800}.sub{fill:#5b6d88;font-size:16px}.lab{fill:#263a59;font-size:16px;font-weight:800}.small{fill:#5b6d88;font-size:13px}.white{fill:#fff}</style>
  </defs>
  <rect width="1200" height="690" rx="26" fill="#f4f7fb"/>
  <text x="58" y="58" class="h">Mean cell temperature does not guarantee a uniform electrochemical state</text>
  <text x="58" y="88" class="sub">Rapid heating and cold operation can create tab-to-core and face-to-edge gradients that redistribute current and electrochemical response.</text>
  <g transform="translate(70 135)">
    <rect x="40" y="30" width="570" height="390" rx="32" fill="#fff" stroke="#9fb2cc" stroke-width="3"/>
    <rect x="60" y="50" width="530" height="350" rx="22" fill="url(#temp)"/>
    <g opacity=".58" fill="none" stroke="#d8f3fa" stroke-width="3"><ellipse cx="210" cy="150" rx="110" ry="78"/><ellipse cx="260" cy="205" rx="190" ry="135"/><ellipse cx="325" cy="235" rx="260" ry="170"/></g>
    <rect x="115" y="0" width="65" height="70" rx="8" fill="#c68f65"/><rect x="470" y="0" width="65" height="70" rx="8" fill="#aeb8c7"/>
    <text x="147" y="-12" text-anchor="middle" class="small">negative tab</text><text x="502" y="-12" text-anchor="middle" class="small">positive tab</text>
    <circle cx="235" cy="90" r="13" fill="#fff" stroke="#14213d" stroke-width="4"/><path d="M235 77v26M222 90h26" stroke="#14213d" stroke-width="3"/><text x="260" y="92" class="small">surface sensor</text>
    <text x="180" y="170" text-anchor="middle" class="white" font-size="20" font-weight="900">warmer face/tab region</text>
    <text x="455" y="330" text-anchor="middle" fill="#e7f0ff" font-size="20" font-weight="900">colder core/edge region</text>
    <rect x="338" y="92" width="208" height="24" rx="12" fill="#132a4f" opacity=".72"/>
    <text x="442" y="108" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="800">illustrative temperature contours</text>
    <g stroke="#ed7049" stroke-width="3.2" fill="none" marker-end="url(#a)">
      <path d="M455 285c-58-14-117-40-170-70"/>
      <path d="M505 242c-66-10-127-27-180-47"/>
    </g>
    <rect x="70" y="348" width="440" height="25" rx="12.5" fill="#132a4f" opacity=".78"/>
    <text x="290" y="365" text-anchor="middle" fill="#fff1e9" font-size="12.5" font-weight="800">current share shifts toward warmer, lower-resistance regions</text>
  </g>
  <g transform="translate(720 150)">
    <rect width="410" height="170" rx="20" fill="#fff" stroke="#c6d4e7"/>
    <text x="24" y="31" class="lab" font-size="15">A surface sensor can miss</text>
    <text x="24" y="52" class="lab" font-size="15">the coldest active region</text>
    <text x="374" y="70" text-anchor="end" fill="#71819a" font-size="13.5" font-weight="800">illustrative example</text>
    <g transform="translate(36 82)">
      <rect width="338" height="18" rx="9" fill="#dfe6ef"/><rect width="175" height="18" rx="9" fill="#f2a24b"/>
      <text x="0" y="47" fill="#5b6d88" font-size="14.5">surface: −8°C</text><text x="338" y="47" text-anchor="end" fill="#5b6d88" font-size="14.5">core: −18°C</text>
    </g>
    <text x="205" y="153" text-anchor="middle" fill="#b2492f" font-size="12.5" font-weight="850">A favorable surface reading can conceal slower internal kinetics</text>
  </g>
  <g transform="translate(720 345)">
    <rect width="410" height="195" rx="20" fill="#14213d"/>
    <text x="24" y="36" class="white" font-size="16" font-weight="800">Colder local region</text>
    <g transform="translate(25 55)"><text x="0" y="18" fill="#bdd0eb" font-size="13">higher ionic / interfacial resistance</text><path d="M212 13h131" stroke="#6f829e" stroke-width="11" stroke-linecap="round"/><path d="M212 13h112" stroke="#ed7049" stroke-width="11" stroke-linecap="round"/></g>
    <g transform="translate(25 95)"><text x="0" y="18" fill="#bdd0eb" font-size="13">smaller graphite receiving margin</text><path d="M212 13h131" stroke="#6f829e" stroke-width="11" stroke-linecap="round"/><path d="M212 13h42" stroke="#63cbe1" stroke-width="11" stroke-linecap="round"/></g>
    <g transform="translate(25 135)"><text x="0" y="18" fill="#bdd0eb" font-size="13">greater cutoff / plating susceptibility</text><path d="M212 13h131" stroke="#6f829e" stroke-width="11" stroke-linecap="round"/><path d="M212 13h116" stroke="#ed7049" stroke-width="11" stroke-linecap="round"/></g>
  </g>
  <g transform="translate(70 585)">
    <rect width="1060" height="62" rx="15" fill="#eaf2ff"/>
    <text x="24" y="24" fill="#294f8c" font-size="15" font-weight="900">Thermal strategy must specify sensor location, warm-up time, internal uniformity, and conditioning energy.</text>
    <text x="24" y="48" class="small">A favorable mean is insufficient if the coldest active region remains more resistive or closer to the plating boundary.</text>
  </g>
</svg>
