<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Why silicon requires dynamic electrolyte and interphase control</title>
  <desc id="desc">A three-part scientific diagram showing silicon expansion, SEI fracture and repeated renewal; electrolyte control levers; and the constraints of a practical silicon-graphite full cell.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#eaf2ff"/></linearGradient>
    <linearGradient id="si" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9b8af4"/><stop offset="1" stop-color="#5a49ba"/></linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#294f92"/><stop offset=".52" stop-color="#eef4ff"/><stop offset="1" stop-color="#d66b47"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16325c" flood-opacity=".11"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0l10 3-10 3z" fill="#5379ad"/></marker>
    <marker id="loss" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0l10 3-10 3z" fill="#d25b4a"/></marker>
  </defs>
  <rect width="1400" height="900" rx="30" fill="url(#bg)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="55" y="58" fill="#12284b" font-family="Manrope,Arial,sans-serif" font-size="31" font-weight="800">Why silicon changes the job of the electrolyte</text>
    <text x="55" y="88" fill="#536784" font-size="16">From repeated surface renewal to chemistry-led interphase control under practical cell constraints</text>

    <g filter="url(#shadow)">
      <rect x="45" y="120" width="540" height="660" rx="24" fill="#fff" stroke="#cad8eb"/>
      <rect x="610" y="120" width="335" height="660" rx="24" fill="#fff" stroke="#cad8eb"/>
      <rect x="970" y="120" width="385" height="660" rx="24" fill="#fff" stroke="#cad8eb"/>
    </g>

    <g>
      <circle cx="82" cy="160" r="20" fill="#173e75"/><text x="82" y="166" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">1</text>
      <text x="115" y="167" fill="#173254" font-size="21" font-weight="800">Why passivation fails repeatedly</text>
      <text x="78" y="205" fill="#60728e" font-size="14">One silicon domain across a charge–discharge cycle</text>

      <g transform="translate(70 240)">
        <text x="70" y="0" text-anchor="middle" fill="#29415f" font-size="14" font-weight="700">Before lithiation</text>
        <circle cx="70" cy="83" r="50" fill="url(#si)"/>
        <circle cx="70" cy="83" r="58" fill="none" stroke="#45a6a1" stroke-width="9"/>
        <text x="70" y="88" text-anchor="middle" fill="#fff" font-size="17" font-weight="800">Si</text>
        <text x="70" y="163" text-anchor="middle" fill="#43847f" font-size="13">continuous SEI</text>
      </g>
      <path d="M215 324h54" fill="none" stroke="#5379ad" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="241" y="306" text-anchor="middle" fill="#5379ad" font-size="12" font-weight="700">Li⁺ in</text>
      <g transform="translate(278 225)">
        <text x="86" y="15" text-anchor="middle" fill="#29415f" font-size="14" font-weight="700">Lithiation: expansion</text>
        <circle cx="86" cy="99" r="76" fill="url(#si)"/>
        <path d="M19 62a84 84 0 0 1 45-42M110 18a84 84 0 0 1 46 42M160 102a84 84 0 0 1-19 52M88 184a84 84 0 0 1-54-23" fill="none" stroke="#45a6a1" stroke-width="10" stroke-linecap="round"/>
        <path d="M57 39l14 19-9 17M144 70l-20 13 14 17M45 149l20-11 9 19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
        <text x="86" y="105" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">LixSi</text>
        <text x="86" y="205" text-anchor="middle" fill="#c45245" font-size="13">SEI opens under strain</text>
      </g>
      <path d="M435 447c72 32 77 105 27 139" fill="none" stroke="#5379ad" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="505" y="508" text-anchor="middle" fill="#5379ad" font-size="12" font-weight="700">Li⁺ out</text>
      <g transform="translate(275 520)">
        <text x="88" y="0" text-anchor="middle" fill="#29415f" font-size="14" font-weight="700">Contraction: fresh surface</text>
        <path d="M39 55c21-28 75-30 100-5 17 17 21 59 2 84-25 32-83 31-106 0-17-23-14-57 4-79z" fill="url(#si)"/>
        <path d="M26 48c24-42 99-49 133-9M166 71c9 28 3 60-18 81M132 165c-35 19-80 11-104-20" fill="none" stroke="#45a6a1" stroke-width="9" stroke-linecap="round"/>
        <path d="M57 63l13 19-12 19M118 56l-16 22 15 20" fill="none" stroke="#fff" stroke-width="5"/>
        <g fill="#e8a847"><circle cx="70" cy="42" r="7"/><circle cx="113" cy="39" r="7"/><circle cx="150" cy="58" r="7"/></g>
        <path d="M74 33l-10-24M113 29l3-27M151 48l20-20" fill="none" stroke="#e8a847" stroke-width="2"/>
        <text x="88" y="192" text-anchor="middle" fill="#c45245" font-size="13">electrolyte reaches unprotected Si</text>
      </g>
      <g transform="translate(74 525)">
        <rect width="155" height="178" rx="16" fill="#fff6f3" stroke="#efc2b9"/>
        <text x="18" y="28" fill="#a84237" font-size="13" font-weight="800">REPEATED REDUCTION</text>
        <path d="M24 51h106" stroke="#e8b2a9"/>
        <g fill="#5b6d87" font-size="13"><text x="18" y="78">• cyclable Li loss</text><text x="18" y="103">• electrolyte loss</text><text x="18" y="128">• gas / swelling</text><text x="18" y="153">• pore blockage</text></g>
      </g>
      <path d="M245 618h28" fill="none" stroke="#d25b4a" stroke-width="3" marker-end="url(#loss)"/>
      <path d="M373 708c-96 50-225 20-262-23" fill="none" stroke="#d25b4a" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#loss)"/>
      <text x="315" y="754" text-anchor="middle" fill="#a84237" font-size="12" font-weight="700">renewal cycle repeats while reactive surface is generated</text>
    </g>

    <g>
      <circle cx="647" cy="160" r="20" fill="#173e75"/><text x="647" y="166" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">2</text>
      <text x="680" y="167" fill="#173254" font-size="21" font-weight="800">What chemistry can control</text>
      <g transform="translate(645 215)">
        <circle cx="132" cy="250" r="65" fill="url(#si)"/>
        <circle cx="132" cy="250" r="79" fill="none" stroke="#45a6a1" stroke-width="12" stroke-dasharray="48 13"/>
        <text x="132" y="247" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">moving Si</text>
        <text x="132" y="269" text-anchor="middle" fill="#eeeaff" font-size="12">interface</text>

        <g>
          <rect x="5" y="0" width="254" height="94" rx="15" fill="#eef5ff" stroke="#a9c4ea"/>
          <text x="22" y="27" fill="#204f8f" font-size="14" font-weight="800">REACTION SEQUENCE</text>
          <text x="22" y="53" fill="#4b617d" font-size="13">additive competition • first reduction</text>
          <text x="22" y="75" fill="#4b617d" font-size="13">finite repassivation inventory • formation</text>
          <path d="M132 95v61" stroke="#7da3d2" stroke-width="2.5" marker-end="url(#arrow)"/>
        </g>
        <g>
          <rect x="5" y="405" width="254" height="94" rx="15" fill="#f1edff" stroke="#b8aaf0"/>
          <text x="22" y="432" fill="#5b45b0" font-size="14" font-weight="800">SOLVATION ENVIRONMENT</text>
          <text x="22" y="458" fill="#4b617d" font-size="13">free-solvent activity • coordination</text>
          <text x="22" y="480" fill="#4b617d" font-size="13">anion participation • desolvation</text>
          <path d="M132 404v-61" stroke="#8e7bd5" stroke-width="2.5" marker-end="url(#arrow)"/>
        </g>
        <g>
          <rect x="-20" y="125" width="118" height="92" rx="15" fill="#edf9f7" stroke="#91d1c8"/>
          <text x="-4" y="152" fill="#267970" font-size="13" font-weight="800">COMPOSITION</text>
          <text x="-4" y="178" fill="#4b617d" font-size="12">LiF / inorganic</text><text x="-4" y="198" fill="#4b617d" font-size="12">organic / polymer</text>
          <path d="M99 194l32 24" stroke="#63a9a1" stroke-width="2.5" marker-end="url(#arrow)"/>
        </g>
        <g>
          <rect x="166" y="125" width="118" height="92" rx="15" fill="#fff7e9" stroke="#eac177"/>
          <text x="181" y="152" fill="#9a6714" font-size="13" font-weight="800">MECHANICS</text>
          <text x="181" y="178" fill="#4b617d" font-size="12">adhesion / slip</text><text x="181" y="198" fill="#4b617d" font-size="12">transport / blocking</text>
          <path d="M166 194l-32 24" stroke="#c89a48" stroke-width="2.5" marker-end="url(#arrow)"/>
        </g>
      </g>
      <rect x="646" y="730" width="263" height="28" rx="14" fill="#173e75"/>
      <text x="777" y="749" text-anchor="middle" fill="#fff" font-size="12" font-weight="800">GOAL: BOUNDED INTERPHASE RENEWAL</text>
    </g>

    <g>
      <circle cx="1007" cy="160" r="20" fill="#173e75"/><text x="1007" y="166" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">3</text>
      <text x="1040" y="167" fill="#173254" font-size="21" font-weight="800">Where success is judged</text>
      <text x="1005" y="205" fill="#60728e" font-size="14">A practical Si/graphite full cell</text>
      <g transform="translate(1005 235)">
        <rect x="0" y="0" width="315" height="185" rx="20" fill="#f6f9fe" stroke="#b9cbe3" stroke-width="2"/>
        <rect x="24" y="24" width="72" height="137" rx="12" fill="#294f92"/>
        <rect x="104" y="24" width="12" height="137" rx="6" fill="#93a9c5"/>
        <rect x="124" y="24" width="67" height="137" rx="12" fill="#dff0ff" stroke="#8bbce5"/>
        <rect x="199" y="24" width="12" height="137" rx="6" fill="#93a9c5"/>
        <rect x="219" y="24" width="72" height="137" rx="12" fill="#d66b47"/>
        <g fill="#baaaf3"><circle cx="47" cy="58" r="9"/><circle cx="74" cy="88" r="12"/><circle cx="50" cy="124" r="13"/><circle cx="76" cy="138" r="7"/></g>
        <path d="M136 58h42M136 84h42M136 110h42M136 136h42" stroke="#6ea7d6" stroke-width="3" stroke-linecap="round"/>
        <g fill="#f4bea9"><circle cx="244" cy="55" r="11"/><circle cx="269" cy="82" r="9"/><circle cx="244" cy="113" r="10"/><circle cx="269" cy="137" r="11"/></g>
        <text x="60" y="181" text-anchor="middle" fill="#244b85" font-size="12" font-weight="800">Si/GRAPHITE</text>
        <text x="157" y="181" text-anchor="middle" fill="#397aa8" font-size="12" font-weight="800">ELECTROLYTE</text>
        <text x="255" y="181" text-anchor="middle" fill="#a84c36" font-size="12" font-weight="800">CATHODE</text>
      </g>
      <g transform="translate(1005 455)">
        <rect width="315" height="238" rx="18" fill="#f8fbff" stroke="#d0dced"/>
        <text x="20" y="31" fill="#173254" font-size="14" font-weight="800">NON-NEGOTIABLE CONSTRAINTS</text>
        <g fill="#4d617d" font-size="14">
          <text x="22" y="67">• finite cyclable lithium</text><text x="22" y="96">• finite electrolyte / E:C ratio</text><text x="22" y="125">• cathode oxidation and cross-talk</text><text x="22" y="154">• wetting and impedance</text><text x="22" y="183">• gas, swelling, temperature</text><text x="22" y="212">• loading, pressure, formation</text>
        </g>
      </g>
      <path d="M1163 421v25" stroke="#5379ad" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="1018" y="722" width="289" height="36" rx="18" fill="#fff0ec" stroke="#efb3a7"/>
      <text x="1162" y="745" text-anchor="middle" fill="#a84237" font-size="13" font-weight="800">HALF-CELL IMPROVEMENT ≠ FULL-CELL DURABILITY</text>
    </g>

    <g>
      <path d="M54 830h1292" stroke="#b9c9de" stroke-width="2"/>
      <text x="700" y="867" text-anchor="middle" fill="#173254" font-size="20" font-weight="800">From forming an SEI once → to controlling how the interphase renews throughout cell life</text>
    </g>
  </g>
</svg>
