<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">From additive identity to coupled full-cell functions</title>
  <desc id="desc">Representative additives connect to multiple functional jobs, which act together at the silicon anode, electrolyte, and cathode. The network emphasizes that package performance depends on competing reaction rates at both electrodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#dceaff"/><stop offset=".48" stop-color="#f8fbff"/><stop offset=".52" stop-color="#f8fbff"/><stop offset="1" stop-color="#e8e1ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17335f" flood-opacity=".11"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#7891b5"/></marker>
    <style>
      .t{font-family:Inter,Arial,sans-serif;fill:#14213d}.title{font-size:34px;font-weight:800}.sub{font-size:18px;fill:#52637f}.kicker{font-size:14px;font-weight:800;letter-spacing:1.5px;fill:#2a66d9}.node{fill:#fff;stroke:#b8c8df;stroke-width:2}.nlabel{font-size:18px;font-weight:800}.small{font-size:14px;fill:#53647f}.job{fill:#fff;stroke-width:2.5}.jobtitle{font-size:17px;font-weight:800}.jobsub{font-size:13px;fill:#53647f}.link{fill:none;stroke:#92a8c7;stroke-width:2.5;opacity:.8;marker-end:url(#arrow)}.celltitle{font-size:18px;font-weight:800}.out{font-size:15px;font-weight:700}.foot{font-size:18px;font-weight:800;fill:#fff}.foot2{font-size:14px;fill:#dbe9ff}
    </style>
  </defs>
  <rect width="1400" height="900" rx="30" fill="url(#bg)"/>
  <text class="t title" x="55" y="63">Molecular identity is not a single function</text>
  <text class="t sub" x="55" y="94">Additives create a network of coupled reactions; the full cell integrates their benefits and penalties.</text>

  <text class="t kicker" x="62" y="145">REPRESENTATIVE CHEMISTRIES</text>
  <text class="t kicker" x="470" y="145">FUNCTIONAL JOBS</text>
  <text class="t kicker" x="1025" y="145">WHERE CONSEQUENCES APPEAR</text>

  <g filter="url(#shadow)">
    <rect class="node" x="55" y="170" width="295" height="78" rx="16"/><text class="t nlabel" x="80" y="202">FEC / VC</text><text class="t small" x="80" y="227">reduction-active cyclic carbonates</text>
    <rect class="node" x="55" y="268" width="295" height="78" rx="16"/><text class="t nlabel" x="80" y="300">LiDFOB</text><text class="t small" x="80" y="325">borate/oxalate salt additive</text>
    <rect class="node" x="55" y="366" width="295" height="78" rx="16"/><text class="t nlabel" x="80" y="398">APTES</text><text class="t small" x="80" y="423">amine + hydrolysable silane</text>
    <rect class="node" x="55" y="464" width="295" height="88" rx="16"/><text class="t nlabel" x="80" y="496">Dioxolone derivatives</text><text class="t small" x="80" y="521">polymerizing / fluorinated / silylated</text>
    <rect class="node" x="55" y="572" width="295" height="88" rx="16"/><text class="t nlabel" x="80" y="604">Phosphazenes / nitriles</text><text class="t small" x="80" y="629">structure-dependent full-cell additives</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="job" x="450" y="165" width="390" height="82" rx="17" stroke="#2a66d9"/><circle cx="479" cy="195" r="10" fill="#2a66d9"/><text class="t jobtitle" x="500" y="196">Preferential reduction</text><text class="t jobsub" x="479" y="221">reaction order and first-film composition</text>
    <rect class="job" x="450" y="263" width="390" height="82" rx="17" stroke="#7557d8"/><circle cx="479" cy="293" r="10" fill="#7557d8"/><text class="t jobtitle" x="500" y="294">Polymerization, mechanics, gas</text><text class="t jobsub" x="479" y="319">coverage, cohesion, permeability, swelling</text>
    <rect class="job" x="450" y="361" width="390" height="82" rx="17" stroke="#df8b24"/><circle cx="479" cy="391" r="10" fill="#df8b24"/><text class="t jobtitle" x="500" y="392">HF / PF₅ / reactive-species control</text><text class="t jobsub" x="479" y="417">scavenging plus new reaction products</text>
    <rect class="job" x="450" y="459" width="390" height="82" rx="17" stroke="#159b81"/><circle cx="479" cy="489" r="10" fill="#159b81"/><text class="t jobtitle" x="500" y="490">Salt-derived inorganic chemistry</text><text class="t jobsub" x="479" y="515">borate, oxalate, phosphate, fluoride pathways</text>
    <rect class="job" x="450" y="557" width="390" height="82" rx="17" stroke="#c94e61"/><circle cx="479" cy="587" r="10" fill="#c94e61"/><text class="t jobtitle" x="500" y="588">Cathode protection and cross-talk</text><text class="t jobsub" x="479" y="613">CEI, oxidation, metal dissolution, shared species</text>
  </g>

  <g>
    <path class="link" d="M350 195C395 195 400 195 446 195"/><path class="link" d="M350 215C403 215 393 288 446 295"/>
    <path class="link" d="M350 298C401 298 394 483 446 490"/><path class="link" d="M350 318C408 318 391 578 446 588"/>
    <path class="link" d="M350 394C398 394 400 394 446 394"/><path class="link" d="M350 414C405 414 394 304 446 304"/>
    <path class="link" d="M350 490C404 490 390 215 446 210"/><path class="link" d="M350 510C405 510 397 312 446 310"/><path class="link" d="M350 530C404 530 395 410 446 405"/>
    <path class="link" d="M350 598C402 598 395 590 446 590"/><path class="link" d="M350 622C405 622 396 319 446 316"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="925" y="170" width="420" height="470" rx="22" fill="#fff" stroke="#9fb2cf" stroke-width="2"/>
    <text class="t celltitle" x="955" y="207">PRACTICAL SILICON-CONTAINING FULL CELL</text>
    <rect x="955" y="238" width="360" height="166" rx="18" fill="url(#cell)" stroke="#c2d0e3"/>
    <rect x="980" y="266" width="82" height="108" rx="13" fill="#3c5c7e"/><path d="M996 288l16 22 12-17 19 24-15 33h-32z" fill="#7fc7ff"/><text class="t celltitle" x="974" y="393">Si/graphite</text>
    <path d="M1082 283h104M1082 321h104M1082 359h104" stroke="#9ab0cc" stroke-width="4" stroke-linecap="round"/><circle cx="1102" cy="283" r="7" fill="#2a66d9"/><circle cx="1156" cy="321" r="7" fill="#2a66d9"/><circle cx="1128" cy="359" r="7" fill="#2a66d9"/><text class="t small" x="1086" y="393">shared electrolyte</text>
    <rect x="1205" y="266" width="82" height="108" rx="13" fill="#6752a6"/><path d="M1222 286h48v13h-48zm0 23h48v13h-48zm0 23h48v13h-48z" fill="#d9ceff"/><text class="t celltitle" x="1216" y="393">cathode</text>
    <text class="t out" x="958" y="450">ANODE-SIDE OUTCOMES</text>
    <text class="t small" x="958" y="477">• first-cycle efficiency and renewed-surface reaction</text>
    <text class="t small" x="958" y="502">• SEI mass, impedance, isolation, lithium loss</text>
    <text class="t out" x="958" y="542">SHARED / CATHODE-SIDE OUTCOMES</text>
    <text class="t small" x="958" y="569">• CEI growth, gas, oxidation, metal cross-talk</text>
    <text class="t small" x="958" y="594">• solvent inventory, storage, temperature response</text>
  </g>

  <path class="link" d="M840 206C885 206 877 280 921 286"/><path class="link" d="M840 304C890 304 878 350 921 353"/><path class="link" d="M840 402C889 402 882 426 921 431"/><path class="link" d="M840 500C886 500 884 490 921 487"/><path class="link" d="M840 598C885 598 882 566 921 559"/>

  <rect x="55" y="714" width="1290" height="132" rx="21" fill="#14213d"/>
  <text class="t foot" x="700" y="758" text-anchor="middle">Package performance emerges from competing reaction rates at both electrodes.</text>
  <text class="t foot2" x="700" y="792" text-anchor="middle">The target is not the largest number of functions, but the smallest package that supplies the missing job</text>
  <text class="t foot2" x="700" y="818" text-anchor="middle">without increasing gas, impedance, cross-talk, or irreversible lithium and electrolyte consumption.</text>
</svg>
