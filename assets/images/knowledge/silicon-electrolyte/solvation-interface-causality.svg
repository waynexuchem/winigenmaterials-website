<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc">
  <title id="title">Solvation structure determines which species reach and react at silicon</title>
  <desc id="desc">Four electrolyte strategies are compared from bulk coordination state through interfacial species presentation to likely silicon interphase tendency, followed by shared practical constraints.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17335f" flood-opacity=".1"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#7f96b7"/></marker>
    <style>
      .t{font-family:Inter,Arial,sans-serif;fill:#14213d}.title{font-size:32px;font-weight:800}.sub{font-size:17px;fill:#52637f}.head{font-size:13px;font-weight:800;letter-spacing:1.35px;fill:#2a66d9}.rowtitle{font-size:18px;font-weight:800}.body{font-size:13px;fill:#53647f}.strong{font-size:14px;font-weight:800}.card{fill:#fff;stroke:#c1cee0;stroke-width:2}.flow{stroke:#7f96b7;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.si{fill:#395a7c}.sei{fill:none;stroke-width:8;stroke-linecap:round}.constraint{font-size:14px;font-weight:750}.foot{font-size:14px;fill:#dce8fa}.footStrong{font-size:18px;font-weight:800;fill:#fff}
    </style>
  </defs>
  <rect width="1400" height="940" rx="30" fill="url(#bg)"/>
  <text class="t title" x="52" y="58">Solvation structure determines which species reach and react at silicon</text>
  <text class="t sub" x="52" y="88">Recipe → coordination populations → interfacial presentation → competitive reduction → interphase tendency</text>

  <g transform="translate(963 82)">
    <circle cx="0" cy="0" r="8" fill="#2a66d9"/><text class="t body" x="14" y="5">Li⁺</text>
    <circle cx="78" cy="0" r="8" fill="#61a8f3"/><text class="t body" x="92" y="5">solvent</text>
    <rect x="173" y="-8" width="16" height="16" rx="3" fill="#7557d8"/><text class="t body" x="197" y="5">anion</text>
    <circle cx="267" cy="0" r="8" fill="#23aa93" stroke="#147866" stroke-dasharray="3 2"/><text class="t body" x="281" y="5">diluent</text>
  </g>

  <text class="t head" x="52" y="135">DESIGN ROUTE</text>
  <text class="t head" x="285" y="135">BULK COORDINATION TENDENCY</text>
  <text class="t head" x="705" y="135">PRESENTED NEAR SILICON</text>
  <text class="t head" x="1075" y="135">REACTION / SEI TENDENCY</text>

  <!-- Row 1 -->
  <g filter="url(#shadow)"><rect class="card" x="44" y="158" width="1312" height="132" rx="19"/></g>
  <text class="t rowtitle" x="65" y="198">DILUTE</text><text class="t body" x="65" y="221">solvent dominated</text><text class="t body" x="65" y="242">mature processing</text>
  <g transform="translate(420 224)"><circle r="14" fill="#2a66d9"/><circle cx="-52" cy="-20" r="11" fill="#61a8f3"/><circle cx="48" cy="-27" r="11" fill="#61a8f3"/><circle cx="-42" cy="38" r="11" fill="#61a8f3"/><circle cx="53" cy="32" r="11" fill="#61a8f3"/><circle cx="105" cy="-8" r="10" fill="#61a8f3"/><rect x="79" y="28" width="20" height="20" rx="4" fill="#7557d8"/></g>
  <text class="t body" x="525" y="205">free solvent abundant</text><text class="t body" x="525" y="227">solvent-separated pairs</text><text class="t body" x="525" y="249">additive/carbonate compete</text>
  <path class="flow" d="M665 224H700"/><g transform="translate(835 214)"><circle cx="-62" cy="-26" r="10" fill="#61a8f3"/><circle cx="-24" cy="9" r="10" fill="#61a8f3"/><circle cx="18" cy="-18" r="10" fill="#61a8f3"/><circle cx="52" cy="18" r="10" fill="#61a8f3"/><path d="M83 -43v86" stroke="#395a7c" stroke-width="15" stroke-linecap="round"/></g><text class="t strong" x="835" y="271" text-anchor="middle">free solvent + additive</text>
  <path class="flow" d="M1015 224H1060"/><g transform="translate(1232 224)"><rect class="si" x="-94" y="22" width="150" height="34" rx="8"/><path class="sei" d="M-85 6Q-20-22 45 5" stroke="#61a8f3"/><circle cx="-52" cy="-18" r="8" fill="#7557d8"/><circle cx="18" cy="-12" r="8" fill="#df8b24"/></g><text class="t strong" x="1080" y="190">mixed solvent/additive SEI</text>

  <!-- Row 2 -->
  <g filter="url(#shadow)"><rect class="card" x="44" y="310" width="1312" height="132" rx="19"/></g>
  <text class="t rowtitle" x="65" y="350">HCE</text><text class="t body" x="65" y="373">high salt content</text><text class="t body" x="65" y="394">low free-solvent activity</text>
  <g transform="translate(420 376)"><circle r="14" fill="#2a66d9"/><circle cx="-40" cy="-30" r="11" fill="#61a8f3"/><circle cx="42" cy="34" r="11" fill="#61a8f3"/><rect x="31" y="-41" width="22" height="22" rx="4" fill="#7557d8"/><rect x="-58" y="21" width="22" height="22" rx="4" fill="#7557d8"/><rect x="75" y="0" width="22" height="22" rx="4" fill="#7557d8"/></g>
  <text class="t body" x="525" y="357">contact pairs + aggregates</text><text class="t body" x="525" y="379">more anion around Li⁺</text><text class="t body" x="525" y="401">little free solvent</text>
  <path class="flow" d="M665 376H700"/><g transform="translate(835 366)"><circle cx="-50" cy="-25" r="10" fill="#2a66d9"/><rect x="-20" y="-41" width="20" height="20" rx="4" fill="#7557d8"/><rect x="18" y="4" width="20" height="20" rx="4" fill="#7557d8"/><circle cx="-17" cy="23" r="9" fill="#61a8f3"/><path d="M83 -43v86" stroke="#395a7c" stroke-width="15" stroke-linecap="round"/></g><text class="t strong" x="835" y="423" text-anchor="middle">anion-rich clusters</text>
  <path class="flow" d="M1015 376H1060"/><g transform="translate(1232 376)"><rect class="si" x="-94" y="22" width="150" height="34" rx="8"/><path class="sei" d="M-85 6Q-20-22 45 5" stroke="#7557d8"/><rect x="-54" y="-22" width="15" height="15" rx="3" fill="#159b81"/><rect x="12" y="-16" width="15" height="15" rx="3" fill="#159b81"/></g><text class="t strong" x="1080" y="342">more salt-derived</text><text class="t strong" x="1080" y="362">inorganic tendency</text>

  <!-- Row 3 -->
  <g filter="url(#shadow)"><rect class="card" x="44" y="462" width="1312" height="132" rx="19"/></g>
  <text class="t rowtitle" x="65" y="502">LHCE</text><text class="t body" x="65" y="525">localized clusters</text><text class="t body" x="65" y="546">weak diluent in bulk</text>
  <g transform="translate(420 528)"><circle r="14" fill="#2a66d9"/><circle cx="-32" cy="-28" r="10" fill="#61a8f3"/><rect x="25" y="-37" width="20" height="20" rx="4" fill="#7557d8"/><rect x="-47" y="21" width="20" height="20" rx="4" fill="#7557d8"/><circle cx="82" cy="-27" r="10" fill="#23aa93" stroke="#147866" stroke-dasharray="3 2"/><circle cx="91" cy="28" r="10" fill="#23aa93" stroke="#147866" stroke-dasharray="3 2"/><circle cx="-88" cy="-15" r="10" fill="#23aa93" stroke="#147866" stroke-dasharray="3 2"/><circle cx="-80" cy="40" r="10" fill="#23aa93" stroke="#147866" stroke-dasharray="3 2"/></g>
  <text class="t body" x="525" y="509">HCE-like local cluster</text><text class="t body" x="525" y="531">diluent outside Li⁺ shell</text><text class="t body" x="525" y="553">lower bulk salt burden</text>
  <path class="flow" d="M665 528H700"/><g transform="translate(835 518)"><circle cx="-50" cy="-24" r="10" fill="#2a66d9"/><rect x="-18" y="-39" width="20" height="20" rx="4" fill="#7557d8"/><circle cx="-18" cy="24" r="9" fill="#61a8f3"/><circle cx="31" cy="-3" r="10" fill="#23aa93" stroke="#147866" stroke-dasharray="3 2"/><path d="M83 -43v86" stroke="#395a7c" stroke-width="15" stroke-linecap="round"/></g><text class="t strong" x="835" y="575" text-anchor="middle">locally anion-rich cluster</text>
  <path class="flow" d="M1015 528H1060"/><g transform="translate(1232 528)"><rect class="si" x="-94" y="22" width="150" height="34" rx="8"/><path class="sei" d="M-85 6Q-20-22 45 5" stroke="#159b81"/><rect x="-55" y="-21" width="15" height="15" rx="3" fill="#7557d8"/><rect x="13" y="-15" width="15" height="15" rx="3" fill="#7557d8"/></g><text class="t strong" x="1080" y="494">anion-derived tendency</text><text class="t body" x="1080" y="514">with improved handling target</text>

  <!-- Row 4 -->
  <g filter="url(#shadow)"><rect class="card" x="44" y="614" width="1312" height="132" rx="19"/></g>
  <text class="t rowtitle" x="65" y="654">WEAKLY</text><text class="t rowtitle" x="65" y="677">SOLVATING</text><text class="t body" x="65" y="704">moderate concentration</text>
  <g transform="translate(420 680)"><circle r="14" fill="#2a66d9"/><circle cx="-42" cy="-28" r="10" fill="#61a8f3" opacity=".6"/><circle cx="53" cy="35" r="10" fill="#61a8f3" opacity=".6"/><rect x="29" y="-38" width="21" height="21" rx="4" fill="#7557d8"/><rect x="-55" y="21" width="21" height="21" rx="4" fill="#7557d8"/><rect x="79" y="-4" width="21" height="21" rx="4" fill="#7557d8"/></g>
  <text class="t body" x="525" y="661">weak Li⁺ solvent coordination</text><text class="t body" x="525" y="683">anion remains shell-involved</text><text class="t body" x="525" y="705">moderate salt loading</text>
  <path class="flow" d="M665 680H700"/><g transform="translate(835 670)"><circle cx="-48" cy="-22" r="10" fill="#2a66d9"/><rect x="-14" y="-38" width="20" height="20" rx="4" fill="#7557d8"/><rect x="22" y="7" width="20" height="20" rx="4" fill="#7557d8"/><circle cx="-17" cy="24" r="9" fill="#61a8f3" opacity=".6"/><path d="M83 -43v86" stroke="#395a7c" stroke-width="15" stroke-linecap="round"/></g><text class="t strong" x="835" y="727" text-anchor="middle">anion-involved shell</text>
  <path class="flow" d="M1015 680H1060"/><g transform="translate(1232 680)"><rect class="si" x="-94" y="22" width="150" height="34" rx="8"/><path class="sei" d="M-85 6Q-20-22 45 5" stroke="#2a66d9"/><rect x="-55" y="-21" width="15" height="15" rx="3" fill="#7557d8"/><rect x="13" y="-15" width="15" height="15" rx="3" fill="#159b81"/></g><text class="t strong" x="1080" y="646">lower solvent-activity,</text><text class="t strong" x="1080" y="666">inorganic-rich tendency</text>

  <text class="t head" x="52" y="790">PRACTICAL FILTER — AN INTERFACIAL SHIFT IS USEFUL ONLY IF THE WHOLE CELL STILL WORKS</text>
  <g filter="url(#shadow)">
    <rect x="52" y="812" width="190" height="58" rx="14" fill="#fff" stroke="#c1cee0"/><text class="t constraint" x="147" y="847" text-anchor="middle">viscosity + filling</text>
    <rect x="258" y="812" width="190" height="58" rx="14" fill="#fff" stroke="#c1cee0"/><text class="t constraint" x="353" y="847" text-anchor="middle">wetting + transport</text>
    <rect x="464" y="812" width="190" height="58" rx="14" fill="#fff" stroke="#c1cee0"/><text class="t constraint" x="559" y="847" text-anchor="middle">temperature + phase</text>
    <rect x="670" y="812" width="190" height="58" rx="14" fill="#fff" stroke="#c1cee0"/><text class="t constraint" x="765" y="847" text-anchor="middle">cost + manufacturability</text>
    <rect x="876" y="812" width="225" height="58" rx="14" fill="#fff" stroke="#c1cee0"/><text class="t constraint" x="988" y="847" text-anchor="middle">Al + graphite compatibility</text>
    <rect x="1117" y="812" width="239" height="58" rx="14" fill="#fff" stroke="#c1cee0"/><text class="t constraint" x="1236" y="847" text-anchor="middle">cathode + calendar life</text>
  </g>
  <rect x="52" y="892" width="1304" height="35" rx="12" fill="#14213d"/><text class="t foot" x="704" y="915" text-anchor="middle">Coordination and SEI drawings show population tendencies—not guaranteed structures, products, thickness, or durability.</text>
</svg>
