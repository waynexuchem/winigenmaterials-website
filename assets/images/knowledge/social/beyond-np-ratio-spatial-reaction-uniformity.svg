<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Beyond N/P Ratio — local lithium-acceptance map</title>
  <desc id="desc">Winigen Materials social card showing a dense anode map with three localized low-margin regions and the smallest margin identified as the most likely initial plating site.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d1d43"/>
      <stop offset="1" stop-color="#18376d"/>
    </linearGradient>
    <linearGradient id="mapBackground" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf4ff"/>
    </linearGradient>
    <linearGradient id="marginScale" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#df5a62"/>
      <stop offset=".48" stop-color="#f2b24f"/>
      <stop offset="1" stop-color="#3479d8"/>
    </linearGradient>
    <pattern id="acceptanceGrid" width="48" height="45" patternUnits="userSpaceOnUse">
      <rect width="43" height="40" rx="6" fill="#3f80dc"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#061128" flood-opacity=".30"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1135" cy="-28" r="250" fill="#2d58a0" opacity=".28"/>
  <circle cx="1098" cy="642" r="205" fill="#3777b4" opacity=".18"/>

  <g font-family="Inter,Arial,sans-serif">
    <text x="64" y="84" font-size="19" font-weight="800" letter-spacing="2.4" fill="#7ec9ff">WINIGEN MATERIALS · KNOWLEDGE</text>
    <text x="64" y="167" font-family="Manrope,Arial,sans-serif" font-size="56" font-weight="800" fill="#ffffff">Beyond N/P Ratio</text>
    <text x="64" y="226" font-family="Manrope,Arial,sans-serif" font-size="30" font-weight="700" fill="#d8e6fb">Where does local lithium-</text>
    <text x="64" y="268" font-family="Manrope,Arial,sans-serif" font-size="30" font-weight="700" fill="#d8e6fb">acceptance margin fail first?</text>

    <line x1="64" y1="315" x2="486" y2="315" stroke="#6da6e8" stroke-width="2" opacity=".62"/>
    <text x="64" y="361" font-size="20" font-weight="700" fill="#9cccf5">N/P defines the inventory envelope.</text>
    <text x="64" y="397" font-size="20" font-weight="700" fill="#ffffff">The smallest local margin defines</text>
    <text x="64" y="430" font-size="20" font-weight="700" fill="#ffffff">where plating risk appears first.</text>

    <g transform="translate(64 489)">
      <rect width="336" height="42" rx="21" fill="#ffffff" opacity=".10"/>
      <text x="168" y="27" text-anchor="middle" font-size="15" font-weight="800" letter-spacing=".5" fill="#b9ddff">SPATIAL REACTION UNIFORMITY</text>
    </g>
    <text x="64" y="582" font-size="15" font-weight="700" fill="#87addd">© WINIGEN MATERIALS</text>
  </g>

  <g transform="translate(548 50)" filter="url(#shadow)">
    <rect width="596" height="530" rx="28" fill="url(#mapBackground)"/>
    <g font-family="Inter,Arial,sans-serif">
      <text x="34" y="51" font-size="17" font-weight="800" letter-spacing="1.6" fill="#2a66d9">LOCAL LITHIUM-ACCEPTANCE MAP</text>
      <text x="34" y="82" font-size="17" font-weight="600" fill="#405575">An acceptable average can hide local deficits.</text>

      <g transform="translate(34 111)">
        <rect width="528" height="315" rx="16" fill="#e8f0fc"/>
        <rect x="9" y="10" width="518" height="310" rx="12" fill="url(#acceptanceGrid)"/>

        <!-- Natural field variation -->
        <g>
          <rect x="57" y="10" width="43" height="40" rx="6" fill="#5c94e5"/>
          <rect x="249" y="10" width="43" height="40" rx="6" fill="#3476d4"/>
          <rect x="441" y="10" width="43" height="40" rx="6" fill="#6198df"/>
          <rect x="105" y="55" width="43" height="40" rx="6" fill="#72a2df"/>
          <rect x="345" y="55" width="43" height="40" rx="6" fill="#5790dd"/>
          <rect x="9" y="145" width="43" height="40" rx="6" fill="#5c94df"/>
          <rect x="297" y="190" width="43" height="40" rx="6" fill="#6a9cde"/>
          <rect x="441" y="235" width="43" height="40" rx="6" fill="#5d94dd"/>
        </g>

        <!-- Three low-margin regions -->
        <g>
          <rect x="153" y="55" width="43" height="40" rx="6" fill="#efb04e"/>
          <rect x="201" y="55" width="43" height="40" rx="6" fill="#e9a14d"/>
          <rect x="153" y="100" width="43" height="40" rx="6" fill="#e67459"/>
          <rect x="201" y="100" width="43" height="40" rx="6" fill="#f0ad4e"/>

          <rect x="297" y="145" width="43" height="40" rx="6" fill="#eda64d"/>
          <rect x="345" y="145" width="43" height="40" rx="6" fill="#e47a55"/>
          <rect x="393" y="145" width="43" height="40" rx="6" fill="#efad4d"/>
          <rect x="297" y="190" width="43" height="40" rx="6" fill="#e98252"/>
          <rect x="345" y="190" width="43" height="40" rx="6" fill="#df5a62"/>
          <rect x="393" y="190" width="43" height="40" rx="6" fill="#e88751"/>
          <rect x="345" y="235" width="43" height="40" rx="6" fill="#edaa4d"/>

          <rect x="57" y="235" width="43" height="40" rx="6" fill="#efad4d"/>
          <rect x="105" y="235" width="43" height="40" rx="6" fill="#e57557"/>
          <rect x="57" y="280" width="43" height="40" rx="6" fill="#e9a24b"/>
          <rect x="105" y="280" width="43" height="40" rx="6" fill="#f0b04b"/>
        </g>

        <g fill="none" stroke="#0d1d43" stroke-width="5">
          <ellipse cx="199" cy="98" rx="72" ry="62"/>
          <ellipse cx="367" cy="209" rx="86" ry="76"/>
          <ellipse cx="103" cy="274" rx="68" ry="58"/>
        </g>

        <path d="M426 151L488 104" fill="none" stroke="#0d1d43" stroke-width="4"/>
        <rect x="391" y="62" width="151" height="51" rx="10" fill="#0d1d43"/>
        <text x="466.5" y="83" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">SMALLEST LOCAL</text>
        <text x="466.5" y="101" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">MARGIN</text>
      </g>

      <g transform="translate(34 455)">
        <rect width="232" height="15" rx="7.5" fill="url(#marginScale)"/>
        <text x="0" y="39" font-size="13" font-weight="800" fill="#d6535d">EXHAUSTED</text>
        <text x="232" y="39" text-anchor="end" font-size="13" font-weight="800" fill="#2f70d0">ROBUST</text>
        <text x="558" y="18" text-anchor="end" font-size="14" font-weight="700" fill="#405575">Three illustrative low-margin regions</text>
      </g>
    </g>
  </g>
</svg>
