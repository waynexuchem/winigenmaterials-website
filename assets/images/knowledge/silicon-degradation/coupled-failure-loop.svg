<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Coupled degradation loop in a silicon anode</title>
  <desc id="desc">Initiating lithium silicon phase transformation and lithium gradients drive evolving mechanical, interfacial, porous-electrode, chemical and transport states. Accumulated damage feeds back through reaction heterogeneity, while capacity loss, power loss and swelling are shown as one-way observable outcomes.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#101d38"/>
      <stop offset="1" stop-color="#243d72"/>
    </linearGradient>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="14" viewBox="0 0 18 14" refX="17" refY="7" orient="auto">
      <path d="M1 1L17 7L1 13Z" fill="#7bc6ff"/>
    </marker>
    <marker id="o" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" viewBox="0 0 18 14" refX="17" refY="7" orient="auto">
      <path d="M1 1L17 7L1 13Z" fill="#f28b91"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="30" fill="url(#bg)"/>
  <text x="600" y="72" fill="#fff" font-family="Inter,Arial" font-size="34" font-weight="800" text-anchor="middle">Silicon degradation is a coupled feedback system</text>
  <text x="600" y="108" fill="#b9d9ff" font-family="Inter,Arial" font-size="18" text-anchor="middle">Initiating conditions drive evolving state variables; accumulated damage feeds back through reaction heterogeneity.</text>
  <g font-family="Inter,Arial" font-size="18" font-weight="700" text-anchor="middle">
    <g fill="#fff">
      <rect x="410" y="148" width="380" height="76" rx="18"/>
      <text x="600" y="178" fill="#2a66d9" font-size="12" letter-spacing="1.3">INITIATING CONDITIONS</text>
      <text x="600" y="201" fill="#14213d">Li-Si transformation + Li gradients</text>
    </g>
    <g fill="#e8f5ff">
      <rect x="775" y="280" width="330" height="84" rx="18"/>
      <text x="940" y="305" fill="#2f7f6c" font-size="12" letter-spacing="1.3">EVOLVING STATE</text>
      <text x="940" y="330" fill="#14213d">Stress, plasticity, cracks</text>
      <text x="940" y="352" fill="#52627c" font-size="14" font-weight="500">constraint &#x2022; residual stress</text>
    </g>
    <g fill="#fff2df">
      <rect x="720" y="490" width="350" height="100" rx="18"/>
      <text x="895" y="515" fill="#a46118" font-size="12" letter-spacing="1.3">EVOLVING STATE</text>
      <text x="895" y="540" fill="#14213d">Contact loss + pore-network evolution</text>
      <text x="895" y="562" fill="#52627c" font-size="13" font-weight="500">electronic isolation &#x2022; swelling &#x2022; void formation</text>
      <text x="895" y="580" fill="#52627c" font-size="13" font-weight="500">pore closure</text>
    </g>
    <g fill="#e9fff7">
      <rect x="100" y="490" width="380" height="100" rx="18"/>
      <text x="290" y="515" fill="#2f7f6c" font-size="12" letter-spacing="1.3">EVOLVING STATE</text>
      <text x="290" y="540" fill="#14213d" font-size="17">SEI damage + continued interphase growth</text>
      <text x="290" y="568" fill="#52627c" font-size="14" font-weight="500">fresh surface &#x2022; product accumulation</text>
    </g>
    <g fill="#f5ecff">
      <rect x="75" y="270" width="370" height="110" rx="18"/>
      <text x="260" y="295" fill="#7653a6" font-size="12" letter-spacing="1.3">CUMULATIVE STATE</text>
      <text x="260" y="320" fill="#14213d" font-size="17">Cumulative chemical and transport loss</text>
      <text x="260" y="343" fill="#52627c" font-size="13" font-weight="500">cyclable-Li loss &#x2022; electrolyte depletion</text>
      <text x="260" y="363" fill="#52627c" font-size="13" font-weight="500">interphase volume &#x2022; impedance &#x2022; incomplete wetting</text>
    </g>
  </g>
  <g fill="none" stroke="#7bc6ff" stroke-width="5" marker-end="url(#a)">
    <path d="M790 198C900 208 945 232 948 275"/>
    <path d="M1005 365C1035 425 990 462 945 485"/>
    <path d="M710 545C620 585 565 585 490 545"/>
    <path d="M260 485C185 445 175 415 205 385"/>
    <path d="M445 324C462 326 475 335 487 347"/>
    <path d="M600 256L600 230"/>
  </g>
  <circle cx="600" cy="371" r="112" fill="#0d1930" stroke="#7bc6ff" stroke-width="3"/>
  <text x="600" y="320" fill="#9cd4ff" font-family="Inter,Arial" font-size="12" font-weight="800" letter-spacing="1.3" text-anchor="middle">FEEDBACK STATE</text>
  <text x="600" y="355" fill="#fff" font-family="Manrope,Arial" font-size="25" font-weight="800" text-anchor="middle">Reaction</text>
  <text x="600" y="387" fill="#fff" font-family="Manrope,Arial" font-size="25" font-weight="800" text-anchor="middle">heterogeneity</text>
  <text x="600" y="414" fill="#9cd4ff" font-family="Inter,Arial" font-size="14" text-anchor="middle">localized reaction intensifies</text>
  <text x="600" y="433" fill="#9cd4ff" font-family="Inter,Arial" font-size="14" text-anchor="middle">subsequent damage</text>
  <path d="M600 485L600 606" fill="none" stroke="#f28b91" stroke-width="3" marker-end="url(#o)"/>
  <rect x="420" y="613" width="360" height="50" rx="16" fill="#ffebee" stroke="#f28b91" stroke-width="2"/>
  <text x="600" y="633" fill="#a33b43" font-family="Inter,Arial" font-size="11" font-weight="900" letter-spacing="1.3" text-anchor="middle">OBSERVABLE OUTCOME</text>
  <text x="600" y="653" fill="#14213d" font-family="Inter,Arial" font-size="17" font-weight="800" text-anchor="middle">capacity loss &#x2022; power loss &#x2022; swelling</text>
  <g font-family="Inter,Arial" font-size="13"><circle cx="275" cy="690" r="7" fill="#fff"/><text x="290" y="695" fill="#b9d9ff">initiator</text><rect x="375" y="681" width="18" height="18" rx="4" fill="#e9fff7"/><text x="405" y="695" fill="#b9d9ff">evolving state</text><rect x="525" y="681" width="18" height="18" rx="4" fill="#f5ecff"/><text x="555" y="695" fill="#b9d9ff">cumulative state</text><rect x="685" y="681" width="18" height="18" rx="4" fill="#ffebee"/><text x="715" y="695" fill="#b9d9ff">observable outcome</text></g>
</svg>
