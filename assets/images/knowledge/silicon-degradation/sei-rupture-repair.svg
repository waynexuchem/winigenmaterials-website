<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Mechanical rupture and chemical instability drive continued silicon SEI growth</title>
  <desc id="desc">Two explicitly different views show concurrent silicon interphase mechanisms. A local surface-region view shows heterogeneous old SEI, a branching crack, fresh silicon and deposits on wetted crack walls. A porous secondary-particle cross-section shows electrolyte penetration, internal interphase accumulation, pore-neck blockage and electronic isolation.</desc>
  <defs>
    <linearGradient id="electrolyte" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4f7ff"/><stop offset="1" stop-color="#f8fcff"/></linearGradient>
    <pattern id="newProducts" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#f1aa4b"/><path d="M-2 7L7-2M2 11L11 2" stroke="#d47c27" stroke-width="1.8"/></pattern>
    <pattern id="host" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(25)"><rect width="12" height="12" fill="#b5c1ce"/><path d="M0 4H12M0 10H12" stroke="#cad3dc" stroke-width="1.2"/></pattern>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#14213d" flood-opacity=".09"/></filter>
    <marker id="cyanArrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11Z" fill="#26a8d8"/></marker>
    <marker id="strainArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#ef665f"/></marker>
  </defs>
  <rect width="1200" height="760" rx="28" fill="#f6f9fd"/>
  <text x="600" y="45" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="28" font-weight="800" fill="#14213d">Mechanical rupture and chemical instability drive continued silicon SEI growth</text>
  <text x="600" y="76" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="800" letter-spacing="1.5" fill="#52627c">CONCURRENT, REPEATING PATHWAYS</text>
  <g font-family="Inter,Arial,sans-serif">
    <!-- Panel A local surface region -->
    <g filter="url(#shadow)"><rect x="45" y="108" width="530" height="480" rx="20" fill="#fff" stroke="#cfdbe7" stroke-width="2"/></g>
    <text x="70" y="141" font-size="18" font-weight="850" fill="#14213d">A  Mechanical instability</text>
    <text x="70" y="163" font-size="12.5" fill="#52627c">local surface region • rupture and renewed reduction</text>
    <rect x="65" y="183" width="490" height="365" rx="14" fill="url(#electrolyte)" stroke="#cfe6f1"/>
    <!-- irregular Si body extends beyond bottom as a local surface crop -->
    <path d="M130 515C105 468 116 405 138 357C148 301 197 250 253 245C304 216 369 232 406 268C456 283 487 329 482 376C502 421 477 475 444 510C412 547 364 553 320 548C266 565 211 546 177 522C159 525 143 522 130 515Z" fill="#409bdf" stroke="#237fc0" stroke-width="3"/>
    <!-- heterogeneous older SEI with varying thickness -->
    <g fill="none" stroke="#62c5a5" stroke-linecap="round"><path d="M139 357C150 306 192 263 245 250" stroke-width="17"/><path d="M259 246C290 232 322 231 346 238" stroke-width="11"/><path d="M379 247C423 262 456 288 474 326" stroke-width="15"/><path d="M486 359C491 400 478 438 457 466" stroke-width="12"/><path d="M437 510C404 540 362 550 324 545" stroke-width="16"/><path d="M274 555C228 551 191 536 170 514" stroke-width="10"/><path d="M138 481C119 438 120 397 130 374" stroke-width="14"/></g>
    <!-- branching, surface-wide crack -->
    <path d="M359 240C347 260 342 279 333 300C325 320 344 335 335 354C326 373 310 381 315 402C320 424 304 440 296 462M335 354C355 367 364 385 372 405M333 300C313 307 298 320 289 338" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- fresh surface at mouth and electrolyte entry -->
    <path d="M358 241C350 256 346 270 341 282" fill="none" stroke="#ef665f" stroke-width="5" stroke-linecap="round"/>
    <path d="M365 199C362 218 361 229 359 241C348 261 342 278 333 300" fill="none" stroke="#26a8d8" stroke-width="4" stroke-dasharray="7 7" marker-end="url(#cyanArrow)"/>
    <!-- products only on electrolyte-accessible crack walls -->
    <g fill="none" stroke="url(#newProducts)" stroke-width="7" stroke-linecap="round"><path d="M347 269L337 299"/><path d="M330 312L341 334"/><path d="M330 356L315 382"/><path d="M320 403L311 428"/><path d="M337 356L357 373"/></g>
    <!-- three generations of local exterior deposit -->
    <path d="M166 512C188 538 224 551 268 554" fill="none" stroke="#62c5a5" stroke-width="17" stroke-linecap="round"/>
    <path d="M169 520C195 546 227 558 265 562" fill="none" stroke="#f6ca88" stroke-width="12" stroke-linecap="round"/>
    <path d="M180 530C204 550 231 558 257 561" fill="none" stroke="url(#newProducts)" stroke-width="7" stroke-linecap="round"/>
    <!-- strain arrows and only three labels -->
    <g fill="none" stroke="#ef665f" stroke-width="3.5" marker-end="url(#strainArrow)"><path d="M128 330L104 306"/><path d="M475 310L500 287"/><path d="M463 473L493 491"/></g>
    <text x="78" y="223" font-size="12.5" font-weight="800" fill="#3e967a">heterogeneous older SEI</text><path d="M204 226L231 251" stroke="#3e967a" stroke-width="1.7"/>
    <text x="371" y="216" font-size="12.5" font-weight="800" fill="#168fbf">fresh surface + electrolyte entry</text><path d="M445 220L363 244" stroke="#168fbf" stroke-width="1.7"/>
    <text x="383" y="372" font-size="12.5" font-weight="800" fill="#b96922">new products on wetted crack walls</text><path d="M379 376L353 369" stroke="#b96922" stroke-width="1.7"/>
    <text x="100" y="525" font-size="11.5" font-weight="750" fill="#b96922">successive deposits</text><path d="M177 521L200 541" stroke="#b96922" stroke-width="1.5"/>
    <text x="310" y="579" text-anchor="middle" font-size="13" font-weight="800" fill="#40516f">renewed reduction restores local coverage</text>

    <!-- Panel B porous secondary particle -->
    <g filter="url(#shadow)"><rect x="625" y="108" width="530" height="480" rx="20" fill="#fff" stroke="#cfdbe7" stroke-width="2"/></g>
    <text x="650" y="141" font-size="18" font-weight="850" fill="#14213d">B  Chemical instability and inward growth</text>
    <text x="650" y="163" font-size="12.5" fill="#52627c">porous secondary-particle cross-section • dissolution, conversion and penetration</text>
    <rect x="645" y="183" width="490" height="365" rx="14" fill="#f5f6f5" stroke="#d9e2e8"/>
    <!-- porous Si-C host -->
    <path d="M739 261C774 220 833 214 877 233C922 216 983 236 1009 278C1050 303 1062 360 1042 401C1038 449 999 486 952 489C912 512 858 501 829 474C783 472 744 444 732 404C703 365 710 305 739 261Z" fill="url(#host)" stroke="#8798aa" stroke-width="3"/>
    <text x="1023" y="479" font-size="11.5" font-weight="800" fill="#687991">porous Si–C host</text><path d="M1018 469L990 451" stroke="#687991" stroke-width="1.5"/>
    <!-- old and newly formed external interphase -->
    <g fill="none" stroke-linecap="round"><path d="M739 261C772 224 828 216 872 234" stroke="#62c5a5" stroke-width="12"/><path d="M899 230C946 224 987 244 1009 278" stroke="url(#newProducts)" stroke-width="17"/><path d="M1040 303C1056 338 1055 372 1042 400" stroke="#62c5a5" stroke-width="11"/><path d="M1023 436C1001 469 976 485 953 489" stroke="url(#newProducts)" stroke-width="18"/><path d="M829 474C787 471 751 443 734 405" stroke="#62c5a5" stroke-width="11"/></g>
    <!-- embedded Si domains -->
    <g fill="#409bdf" stroke="#237fc0" stroke-width="3"><path d="M761 291C782 267 818 272 829 299C840 325 817 348 790 342C763 336 745 312 761 291Z"/><path d="M879 274C903 251 941 260 950 291C958 320 929 342 900 333C873 325 859 294 879 274Z"/><path d="M959 355C980 333 1015 342 1023 371C1030 397 1005 420 978 413C952 406 941 375 959 355Z"/><path d="M820 401C842 375 881 383 889 414C896 442 868 462 840 452C813 442 802 421 820 401Z"/><path d="M740 379C759 359 790 366 797 390C804 413 783 432 759 425C735 419 725 396 740 379Z"/></g>
    <!-- inward electrolyte path and accumulation -->
    <path d="M856 202C853 224 855 240 850 259C841 285 848 307 838 332C828 357 839 380 830 407" fill="none" stroke="#e8faff" stroke-width="18" stroke-linecap="round"/>
    <path d="M856 198C853 224 855 240 850 259C842 282 847 305 838 329" fill="none" stroke="#26a8d8" stroke-width="4.5" stroke-dasharray="8 7" marker-end="url(#cyanArrow)"/>
    <path d="M826 337C839 326 853 329 864 340C875 352 870 369 857 376C841 383 815 353 826 337Z" fill="url(#newProducts)" stroke="#d47c27" stroke-width="2"/>
    <path d="M931 329C918 344 911 361 915 378" fill="none" stroke="url(#newProducts)" stroke-width="10" stroke-linecap="round"/>
    <!-- disrupted carbon path and isolated Si -->
    <path d="M706 468C754 445 789 462 824 443C858 425 879 438 898 431" fill="none" stroke="#263c61" stroke-width="7" stroke-linecap="round"/>
    <path d="M951 418C982 402 1012 415 1046 392" fill="none" stroke="#263c61" stroke-width="7" stroke-linecap="round"/>
    <circle cx="925" cy="426" r="16" fill="#f5f6f5" stroke="#ef665f" stroke-width="2.5" stroke-dasharray="5 5"/>
    <path d="M957 355C980 333 1015 342 1023 371C1030 397 1005 420 978 413C952 406 941 375 957 355Z" fill="none" stroke="#ef665f" stroke-width="5" stroke-dasharray="10 7"/>
    <!-- soluble species shown, not labeled -->
    <g fill="#8b69b6"><circle cx="944" cy="214" r="7"/><circle cx="970" cy="205" r="6"/><circle cx="996" cy="220" r="8"/><circle cx="1013" cy="199" r="5"/></g>
    <g fill="none" stroke="#8b69b6" stroke-width="3" stroke-dasharray="5 5"><path d="M946 249C943 233 943 224 944 214"/><path d="M979 245C984 231 992 225 996 220"/></g>
    <!-- only three consequence labels -->
    <text x="661" y="221" font-size="12.5" font-weight="800" fill="#168fbf">inward electrolyte penetration</text><path d="M793 224L849 252" stroke="#168fbf" stroke-width="1.7"/>
    <text x="659" y="338" font-size="12.5" font-weight="800" fill="#b96922">interphase accumulation<tspan x="659" dy="16">and pore-neck blockage</tspan></text><path d="M788 357L827 350" stroke="#b96922" stroke-width="1.7"/>
    <text x="973" y="344" font-size="12.5" font-weight="800" fill="#c24d58">electronic isolation</text><path d="M1012 348L1001 366" stroke="#c24d58" stroke-width="1.7"/>
    <text x="890" y="579" text-anchor="middle" font-size="13" font-weight="800" fill="#40516f">the active interface moves inward into cracks and pores</text>

    <!-- shared key and outcome hierarchy -->
    <g font-size="11.5" fill="#40516f"><circle cx="165" cy="624" r="8" fill="#409bdf" stroke="#237fc0" stroke-width="2"/><text x="180" y="628">Si</text><rect x="226" y="616" width="22" height="16" rx="3" fill="url(#host)"/><text x="258" y="628">porous Si–C host</text><line x1="390" y1="624" x2="420" y2="624" stroke="#62c5a5" stroke-width="8" stroke-linecap="round"/><text x="432" y="628">older SEI</text><rect x="516" y="616" width="22" height="16" rx="3" fill="url(#newProducts)"/><text x="548" y="628">new interphase products</text><line x1="714" y1="624" x2="744" y2="624" stroke="#26a8d8" stroke-width="4" stroke-dasharray="7 6"/><text x="756" y="628">electrolyte path</text><circle cx="877" cy="624" r="7" fill="#8b69b6"/><text x="893" y="628">soluble species</text><line x1="1000" y1="624" x2="1030" y2="624" stroke="#263c61" stroke-width="6" stroke-linecap="round"/><text x="1042" y="628">carbon path</text></g>
    <line x1="120" y1="660" x2="1080" y2="660" stroke="#cdd8e4" stroke-width="2"/>
    <text x="600" y="691" text-anchor="middle" font-size="16" font-weight="800" fill="#14213d">Repeated reduction consumes lithium and electrolyte while increasing interphase volume</text>
    <text x="600" y="718" text-anchor="middle" font-size="13.5" fill="#52627c">Accumulation raises transport resistance and promotes incomplete wetting</text>
  </g>
</svg>
