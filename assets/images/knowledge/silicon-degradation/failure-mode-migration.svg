<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Silicon design improvements can migrate failure across scales</title>
  <desc id="desc">Four horizontal trade-off lanes show design interventions, their intended benefits, and failure pathways they may expose. Smaller silicon reduces catastrophic fracture but raises surface-area-driven loss. Stronger confinement preserves contact but raises local stress. A rigid interphase reduces continued reduction but may crack. Higher stack pressure limits delamination but compresses pores and separators.</desc>
  <defs>
    <marker id="benefitArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#35a77e"/></marker>
    <marker id="riskArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#df675f"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#6b7c92" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="680" rx="28" fill="#f6f9fd"/>
  <g font-family="Manrope,Arial,sans-serif">
    <text x="600" y="48" text-anchor="middle" font-size="29" font-weight="800" fill="#14213d">Silicon design improvements can migrate failure across scales</text>
    <text x="600" y="78" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#52627c">An intended gain must be evaluated against the different limitation it may expose.</text>
    <text x="230" y="116" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" font-weight="850" letter-spacing="1.2" fill="#287d62">INTENDED GAIN</text>
    <text x="600" y="116" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" font-weight="850" letter-spacing="1.2" fill="#52627c">DESIGN INTERVENTION</text>
    <text x="970" y="116" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" font-weight="850" letter-spacing="1.2" fill="#b6434c">POTENTIALLY EXPOSED FAILURE</text>

    <!-- row guides -->
    <g stroke="#d6e0e9" stroke-width="2"><line x1="74" y1="214" x2="1126" y2="214"/><line x1="74" y1="326" x2="1126" y2="326"/><line x1="74" y1="438" x2="1126" y2="438"/><line x1="74" y1="550" x2="1126" y2="550"/></g>

    <!-- row 1 -->
    <g filter="url(#shadow)"><rect x="455" y="141" width="290" height="58" rx="16" fill="#fff" stroke="#9bbfe7" stroke-width="2"/></g>
    <circle cx="488" cy="170" r="18" fill="#2d73d5"/><circle cx="488" cy="170" r="9" fill="none" stroke="#fff" stroke-width="2"/><text x="520" y="176" font-size="18" font-weight="850" fill="#14213d">Smaller silicon particles</text>
    <path d="M448 170H338" stroke="#35a77e" stroke-width="5" marker-end="url(#benefitArrow)"/><path d="M752 170H862" stroke="#df675f" stroke-width="5" marker-end="url(#riskArrow)"/>
    <text x="230" y="165" text-anchor="middle" font-size="16" font-weight="850" fill="#267d60">less catastrophic fracture</text><text x="230" y="186" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" fill="#52627c">shorter strain and diffusion length</text>
    <text x="970" y="165" text-anchor="middle" font-size="16" font-weight="850" fill="#ad3f48">more surface-driven loss</text><text x="970" y="186" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" fill="#52627c">higher first-cycle and SEI demand</text>

    <!-- row 2 -->
    <g filter="url(#shadow)"><rect x="455" y="253" width="290" height="58" rx="16" fill="#fff" stroke="#9bbfe7" stroke-width="2"/></g>
    <circle cx="488" cy="282" r="18" fill="#2d73d5"/><path d="M479 282H497M482 274L477 282 482 290M494 274L499 282 494 290" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><text x="520" y="288" font-size="18" font-weight="850" fill="#14213d">Stronger confinement</text>
    <path d="M448 282H338" stroke="#35a77e" stroke-width="5" marker-end="url(#benefitArrow)"/><path d="M752 282H862" stroke="#df675f" stroke-width="5" marker-end="url(#riskArrow)"/>
    <text x="230" y="277" text-anchor="middle" font-size="16" font-weight="850" fill="#267d60">better contact retention</text><text x="230" y="298" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" fill="#52627c">less gross separation</text>
    <text x="970" y="277" text-anchor="middle" font-size="16" font-weight="850" fill="#ad3f48">higher local stress</text><text x="970" y="298" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" fill="#52627c">pore restriction and contact loading</text>

    <!-- row 3 -->
    <g filter="url(#shadow)"><rect x="455" y="365" width="290" height="58" rx="16" fill="#fff" stroke="#9bbfe7" stroke-width="2"/></g>
    <circle cx="488" cy="394" r="18" fill="#2d73d5"/><circle cx="488" cy="394" r="10" fill="none" stroke="#fff" stroke-width="3"/><path d="M495 386L499 381" stroke="#fff" stroke-width="2.5"/><text x="520" y="400" font-size="18" font-weight="850" fill="#14213d">More rigid interphase</text>
    <path d="M448 394H338" stroke="#35a77e" stroke-width="5" marker-end="url(#benefitArrow)"/><path d="M752 394H862" stroke="#df675f" stroke-width="5" marker-end="url(#riskArrow)"/>
    <text x="230" y="389" text-anchor="middle" font-size="16" font-weight="850" fill="#267d60">less continued reduction</text><text x="230" y="410" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" fill="#52627c">more persistent local coverage</text>
    <text x="970" y="389" text-anchor="middle" font-size="16" font-weight="850" fill="#ad3f48">greater cracking risk</text><text x="970" y="410" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" fill="#52627c">insufficient strain accommodation</text>

    <!-- row 4 -->
    <g filter="url(#shadow)"><rect x="455" y="477" width="290" height="58" rx="16" fill="#fff" stroke="#9bbfe7" stroke-width="2"/></g>
    <circle cx="488" cy="506" r="18" fill="#2d73d5"/><path d="M478 496V505M498 496V505M480 513H496" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M478 505L488 511 498 505" fill="none" stroke="#fff" stroke-width="2"/><text x="520" y="512" font-size="18" font-weight="850" fill="#14213d">Higher stack pressure</text>
    <path d="M448 506H338" stroke="#35a77e" stroke-width="5" marker-end="url(#benefitArrow)"/><path d="M752 506H862" stroke="#df675f" stroke-width="5" marker-end="url(#riskArrow)"/>
    <text x="230" y="501" text-anchor="middle" font-size="16" font-weight="850" fill="#267d60">less coating delamination</text><text x="230" y="522" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" fill="#52627c">improved macroscopic contact</text>
    <text x="970" y="501" text-anchor="middle" font-size="16" font-weight="850" fill="#ad3f48">pore and separator compression</text><text x="970" y="522" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" fill="#52627c">ionic blockage and wetting loss</text>

    <rect x="120" y="586" width="960" height="62" rx="18" fill="#fff" stroke="#ccd8e4" stroke-width="2"/>
    <text x="600" y="611" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" font-weight="850" letter-spacing="1" fill="#687991">SUCCESS CRITERION</text>
    <text x="600" y="635" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#14213d">Lower total irreversible damage without transferring the dominant limitation to another component or scale</text>
  </g>
</svg>
