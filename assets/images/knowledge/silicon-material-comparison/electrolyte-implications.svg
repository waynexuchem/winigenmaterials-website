<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
  <title id="title">Different interfaces, different electrolyte design targets</title>
  <desc id="desc">Three mechanism diagrams show adaptable mixed-surface passivation for silicon-carbon, separation of external interphase and intrinsic conversion costs for silicon oxide, and low-cost repeated passivation for elemental silicon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f9fd"/><stop offset="1" stop-color="#e9f2fb"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17365e" flood-opacity=".12"/></filter>
    <marker id="end" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#6983a6"/></marker>
    <pattern id="carbon" width="13" height="13" patternUnits="userSpaceOnUse"><rect width="13" height="13" fill="#263b59"/><circle cx="4" cy="4" r="1.4" fill="#718bad"/><circle cx="10" cy="10" r="1.4" fill="#718bad"/></pattern>
    <style>
      .t{font-family:Inter,Arial,sans-serif;fill:#14213d}.h{font:800 32px Manrope,Arial,sans-serif}.sub{font:600 15px Inter,Arial,sans-serif;fill:#586a84}.head{font:800 22px Manrope,Arial,sans-serif;fill:#fff}.lab{font:850 12px Inter,Arial,sans-serif;letter-spacing:1px;fill:#3974c7}.main{font:750 16px Inter,Arial,sans-serif;fill:#14213d}.small{font:600 13px Inter,Arial,sans-serif;fill:#5a6c86}.target{font:800 16px Inter,Arial,sans-serif;fill:#14213d}.flow{stroke:#6983a6;stroke-width:3;fill:none;marker-end:url(#end)}.box{fill:#edf4fc;stroke:#cad9e9;stroke-width:1.4}.orange{fill:#f6e1d5;stroke:#edb99e;stroke-width:1.4}.gold{fill:#f1e2a7;stroke:#ddc46b;stroke-width:1.4}.teal{fill:#e2f3f2;stroke:#a9d8d6;stroke-width:1.4}.fresh{stroke:#ea714c;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.sei{stroke:#55a8df;stroke-width:7;fill:none;stroke-dasharray:8 6}
    </style>
  </defs>
  <rect width="1400" height="660" fill="url(#bg)"/>
  <text x="700" y="49" text-anchor="middle" class="t h">Different Interfaces, Different Electrolyte Design Targets</text>
  <text x="700" y="80" text-anchor="middle" class="sub">The comparison identifies formulation priorities—not fixed electrolyte recipes</text>

  <g transform="translate(55 115)" filter="url(#sh)">
    <rect width="410" height="515" rx="21" fill="#fff"/>
    <rect width="410" height="70" rx="21" fill="#193d6c"/><rect y="49" width="410" height="21" fill="#193d6c"/>
    <text x="24" y="45" class="head">Si-C / Si-graphite</text>
    <text x="205" y="105" text-anchor="middle" class="lab">MIXED, EVOLVING INTERFACE</text>
    <g transform="translate(205 149)">
      <rect x="-116" y="-22" width="232" height="44" rx="12" fill="url(#carbon)"/>
      <circle cx="-54" cy="0" r="18" fill="#86ade0"/><circle cx="18" cy="0" r="14" fill="#76a1d5"/><circle cx="78" cy="0" r="20" fill="#9abbe5"/>
      <path d="M98-20l18-16" class="fresh"/>
    </g>
    <path d="M205 177V210" class="flow"/>
    <rect x="45" y="215" width="320" height="54" rx="11" class="box"/>
    <text x="205" y="237" text-anchor="middle" class="t main">Maintain carbon / graphite compatibility</text>
    <text x="205" y="257" text-anchor="middle" class="small">while passivating exposed Si</text>
    <text x="205" y="308" text-anchor="middle" class="lab">WHEN THE ARCHITECTURE OPENS</text>
    <path d="M205 320V348" class="flow"/>
    <rect x="45" y="353" width="320" height="54" rx="11" class="orange"/>
    <text x="205" y="375" text-anchor="middle" class="t main">Retain passivation capacity</text>
    <text x="205" y="395" text-anchor="middle" class="small">for newly exposed Si</text>
    <rect x="24" y="443" width="362" height="48" rx="13" fill="#e7f0fc"/>
    <text x="205" y="463" text-anchor="middle" class="small">DESIGN TARGET</text>
    <text x="205" y="483" text-anchor="middle" class="t target">Adaptable mixed-surface passivation</text>
  </g>

  <g transform="translate(495 115)" filter="url(#sh)">
    <rect width="410" height="515" rx="21" fill="#fff"/>
    <rect width="410" height="70" rx="21" fill="#387fb9"/><rect y="49" width="410" height="21" fill="#387fb9"/>
    <text x="24" y="45" class="head">SiO<tspan baseline-shift="sub" font-size="14">x</tspan> / SiO<tspan baseline-shift="sub" font-size="14">x</tspan>-graphite</text>
    <text x="205" y="105" text-anchor="middle" class="lab">TWO SOURCES OF FIRST-CYCLE LOSS</text>
    <rect x="22" y="127" width="166" height="92" rx="11" class="orange"/>
    <text x="105" y="151" text-anchor="middle" class="t main">Electrolyte reduction</text>
    <path d="M105 162V179" class="flow"/>
    <text x="105" y="204" text-anchor="middle" class="small">external interphase</text>
    <text x="205" y="178" text-anchor="middle" class="t h" font-size="25">+</text>
    <rect x="222" y="127" width="166" height="92" rx="11" class="gold"/>
    <text x="305" y="151" text-anchor="middle" class="t main">SiO<tspan baseline-shift="sub" font-size="11">x</tspan> conversion</text>
    <path d="M305 162V179" class="flow"/>
    <text x="305" y="204" text-anchor="middle" class="small">Li<tspan baseline-shift="sub" font-size="10">2</tspan>O / silicates</text>
    <path d="M105 228V250H305V228M205 250V278" class="flow"/>
    <rect x="24" y="283" width="362" height="62" rx="11" class="box"/>
    <text x="205" y="308" text-anchor="middle" class="t main">Separate conversion loss from interphase loss</text>
    <text x="205" y="330" text-anchor="middle" class="small">Report prelithiation state explicitly</text>
    <rect x="24" y="443" width="362" height="48" rx="13" fill="#e7f0fc"/>
    <text x="205" y="463" text-anchor="middle" class="small">DESIGN TARGET</text>
    <text x="205" y="483" text-anchor="middle" class="t target">Separate conversion from interphase loss</text>
  </g>

  <g transform="translate(935 115)" filter="url(#sh)">
    <rect width="410" height="515" rx="21" fill="#fff"/>
    <rect width="410" height="70" rx="21" fill="#17939a"/><rect y="49" width="410" height="21" fill="#17939a"/>
    <text x="24" y="45" class="head">Elemental Si</text>
    <text x="205" y="105" text-anchor="middle" class="lab">REPEATED SURFACE RENEWAL</text>
    <rect x="72" y="123" width="266" height="48" rx="11" class="teal"/>
    <text x="205" y="153" text-anchor="middle" class="t main">Alloying ↔ dealloying</text>
    <path d="M205 176V199" class="flow"/>
    <rect x="72" y="204" width="266" height="48" rx="11" class="teal"/>
    <text x="205" y="234" text-anchor="middle" class="t main">Flow · pores · cracks</text>
    <path d="M205 257V280" class="flow"/>
    <rect x="72" y="285" width="266" height="48" rx="11" class="orange"/>
    <text x="205" y="315" text-anchor="middle" class="t main">New reactive surface</text>
    <path d="M205 338V361" class="flow"/>
    <rect x="72" y="366" width="266" height="48" rx="11" class="box"/>
    <text x="205" y="396" text-anchor="middle" class="t main">Continued interphase demand</text>
    <rect x="24" y="443" width="362" height="48" rx="13" fill="#e2f3f2"/>
    <text x="205" y="463" text-anchor="middle" class="small">DESIGN TARGET</text>
    <text x="205" y="483" text-anchor="middle" class="t target">Efficient passivation of renewed surface</text>
  </g>
</svg>
