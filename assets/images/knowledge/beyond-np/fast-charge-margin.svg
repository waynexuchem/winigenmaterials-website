<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Fast charging consumes local lithium-acceptance margin</title><desc id="desc">Side-by-side moderate-charge and fast-charge electrode maps show the same nominal N/P ratio but different local acceptance margin because polarization and reaction concentration rise with rate.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><linearGradient id="bar1"><stop stop-color="#2a66d9"/><stop offset="1" stop-color="#55b7ed"/></linearGradient><linearGradient id="bar2"><stop stop-color="#f0b14e"/><stop offset="1" stop-color="#df5a62"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10244a" flood-opacity=".12"/></filter></defs>
  <rect width="1440" height="760" rx="28" fill="url(#bg)"/>
  <text x="72" y="76" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="2" fill="#2a66d9">RATE CHANGES THE MARGIN, NOT THE NOMINAL RATIO</text>
  <text x="72" y="120" font-family="Manrope,Arial,sans-serif" font-size="34" font-weight="800" fill="#0f1f4d">Fast charge changes accessibility and current distribution—not nominal N/P.</text>
  <g transform="translate(72 176)" filter="url(#s)"><rect width="600" height="464" rx="24" fill="#fff"/><text x="38" y="54" font-family="Manrope,Arial,sans-serif" font-size="25" font-weight="800" fill="#0f1f4d">Moderate charge</text><text x="560" y="54" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" fill="#2a66d9">SAME NOMINAL N/P</text><rect x="38" y="88" width="524" height="104" rx="16" fill="#dae8fb"/><g fill="#2a66d9" opacity=".72"><circle cx="82" cy="140" r="14"/><circle cx="138" cy="140" r="14"/><circle cx="194" cy="140" r="14"/><circle cx="250" cy="140" r="14"/><circle cx="306" cy="140" r="14"/><circle cx="362" cy="140" r="14"/><circle cx="418" cy="140" r="14"/><circle cx="474" cy="140" r="14"/><circle cx="530" cy="140" r="14"/></g><text x="38" y="234" font-family="Inter,Arial,sans-serif" font-size="16" fill="#53657e">Reaction is distributed across more active area.</text><text x="38" y="282" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" fill="#0f1f4d">Local acceptance margin</text><rect x="38" y="304" width="524" height="42" rx="12" fill="#e6edf6"/><rect x="38" y="304" width="414" height="42" rx="12" fill="url(#bar1)"/><text x="38" y="392" font-family="Inter,Arial,sans-serif" font-size="17" fill="#53657e">Lower polarization</text><text x="230" y="392" font-family="Inter,Arial,sans-serif" font-size="17" fill="#53657e">Broader active population</text><text x="38" y="426" font-family="Inter,Arial,sans-serif" font-size="17" fill="#53657e">More time for electrolyte and solid diffusion</text></g>
  <g transform="translate(768 176)" filter="url(#s)"><rect width="600" height="464" rx="24" fill="#fff"/><text x="38" y="54" font-family="Manrope,Arial,sans-serif" font-size="25" font-weight="800" fill="#0f1f4d">Fast charge</text><text x="560" y="54" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" fill="#df5a62">SAME NOMINAL N/P</text><rect x="38" y="88" width="524" height="104" rx="16" fill="#f8e6dc"/><g fill="#e05c61"><circle cx="82" cy="140" r="20"/><circle cx="138" cy="140" r="20"/><circle cx="194" cy="140" r="20"/></g><g fill="#d5bdab" opacity=".45"><circle cx="250" cy="140" r="10"/><circle cx="306" cy="140" r="10"/><circle cx="362" cy="140" r="10"/><circle cx="418" cy="140" r="10"/><circle cx="474" cy="140" r="10"/><circle cx="530" cy="140" r="10"/></g><text x="38" y="234" font-family="Inter,Arial,sans-serif" font-size="16" fill="#53657e">Current crowds into fewer kinetically available regions.</text><text x="38" y="282" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" fill="#0f1f4d">Local acceptance margin</text><rect x="38" y="304" width="524" height="42" rx="12" fill="#e6edf6"/><rect x="38" y="304" width="152" height="42" rx="12" fill="url(#bar2)"/><text x="38" y="392" font-family="Inter,Arial,sans-serif" font-size="17" fill="#53657e">Higher polarization</text><text x="230" y="392" font-family="Inter,Arial,sans-serif" font-size="17" fill="#53657e">Steeper concentration gradients</text><text x="38" y="418" font-family="Inter,Arial,sans-serif" font-size="17" fill="#53657e">Local interfacial potential approaches the</text><text x="38" y="446" font-family="Inter,Arial,sans-serif" font-size="17" fill="#53657e">lithium-deposition condition</text></g>
  <rect x="72" y="680" width="1296" height="52" rx="14" fill="#0f1f4d"/><text x="720" y="714" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff">C-rate does not change nominal N/P; it changes how much anode capacity is kinetically accessible at that moment.</text>
</svg>
