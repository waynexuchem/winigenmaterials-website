<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Local lithium-acceptance margin map</title>
  <desc id="desc">A dense conceptual electrode map showing three local regions with reduced lithium-acceptance margin, including one smallest-margin region identified as the most likely initial plating site.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient>
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#df5a62"/><stop offset=".48" stop-color="#f2b24f"/><stop offset="1" stop-color="#2f77dc"/></linearGradient>
    <pattern id="denseGrid" width="60" height="47" patternUnits="userSpaceOnUse"><rect width="56" height="42" rx="6" fill="#4382dc"/></pattern>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10244a" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1440" height="820" rx="28" fill="url(#bg)"/>
  <text x="72" y="76" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="2" fill="#2a66d9">LOCAL LITHIUM-ACCEPTANCE MARGIN</text>
  <text x="72" y="120" font-family="Manrope,Arial,sans-serif" font-size="34" font-weight="800" fill="#0f1f4d">The smallest local margins identify the most likely initial plating sites.</text>
  <g transform="translate(72 174)" filter="url(#s)"><rect width="850" height="500" rx="24" fill="#fff"/><text x="38" y="54" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="800" fill="#0f1f4d">Illustrative anode map during charge</text>
    <g transform="translate(38 86)">
      <rect width="780" height="376" fill="url(#denseGrid)"/>

      <!-- Subtle field variation -->
      <g>
        <rect x="60" y="0" width="56" height="42" rx="6" fill="#5b94e8"/><rect x="300" y="0" width="56" height="42" rx="6" fill="#3779d8"/><rect x="600" y="0" width="56" height="42" rx="6" fill="#5a91dd"/>
        <rect x="0" y="47" width="56" height="42" rx="6" fill="#3477d8"/><rect x="120" y="47" width="56" height="42" rx="6" fill="#6b9bd8"/><rect x="420" y="47" width="56" height="42" rx="6" fill="#5e94dc"/><rect x="720" y="47" width="56" height="42" rx="6" fill="#3276d7"/>
        <rect x="0" y="141" width="56" height="42" rx="6" fill="#5b91db"/><rect x="360" y="141" width="56" height="42" rx="6" fill="#6b9bd8"/><rect x="660" y="141" width="56" height="42" rx="6" fill="#5d93dc"/>
        <rect x="180" y="188" width="56" height="42" rx="6" fill="#6598dc"/><rect x="300" y="188" width="56" height="42" rx="6" fill="#3477d8"/><rect x="720" y="188" width="56" height="42" rx="6" fill="#6095dc"/>
        <rect x="0" y="235" width="56" height="42" rx="6" fill="#3779d8"/><rect x="360" y="235" width="56" height="42" rx="6" fill="#5d93dc"/><rect x="600" y="235" width="56" height="42" rx="6" fill="#3477d8"/>
        <rect x="300" y="282" width="56" height="42" rx="6" fill="#6297dd"/><rect x="480" y="282" width="56" height="42" rx="6" fill="#3779d8"/><rect x="720" y="282" width="56" height="42" rx="6" fill="#5d93dc"/>
        <rect x="60" y="329" width="56" height="42" rx="6" fill="#3477d8"/><rect x="420" y="329" width="56" height="42" rx="6" fill="#5d93dc"/><rect x="660" y="329" width="56" height="42" rx="6" fill="#3477d8"/>
      </g>

      <!-- Three localized low-margin regions -->
      <g>
        <rect x="180" y="94" width="56" height="42" rx="6" fill="#f0b04b"/><rect x="240" y="94" width="56" height="42" rx="6" fill="#e8a24b"/>
        <rect x="180" y="141" width="56" height="42" rx="6" fill="#e77955"/><rect x="240" y="141" width="56" height="42" rx="6" fill="#efad4d"/>

        <rect x="420" y="141" width="56" height="42" rx="6" fill="#eda74c"/><rect x="480" y="141" width="56" height="42" rx="6" fill="#e78054"/><rect x="540" y="141" width="56" height="42" rx="6" fill="#efae4d"/>
        <rect x="420" y="188" width="56" height="42" rx="6" fill="#e98252"/><rect x="480" y="188" width="56" height="42" rx="6" fill="#df5a62"/><rect x="540" y="188" width="56" height="42" rx="6" fill="#e78a51"/>
        <rect x="480" y="235" width="56" height="42" rx="6" fill="#edaa4d"/>

        <rect x="60" y="282" width="56" height="42" rx="6" fill="#efad4d"/><rect x="120" y="282" width="56" height="42" rx="6" fill="#e57557"/>
        <rect x="60" y="329" width="56" height="42" rx="6" fill="#e9a24b"/><rect x="120" y="329" width="56" height="42" rx="6" fill="#f0b04b"/>
      </g>

      <g fill="none" stroke="#0f1f4d" stroke-width="5">
        <ellipse cx="238" cy="139" rx="76" ry="64"/><ellipse cx="508" cy="207" rx="99" ry="85"/><ellipse cx="118" cy="326" rx="74" ry="61"/>
      </g>
      <path d="M570 149l76-53" stroke="#0f1f4d" stroke-width="5"/>
      <rect x="608" y="38" width="178" height="62" rx="12" fill="#0f1f4d"/>
      <text x="697" y="63" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff">SMALLEST LOCAL</text>
      <text x="697" y="85" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff">MARGIN</text>
    </g>
  </g>
  <g transform="translate(966 174)" filter="url(#s)"><rect width="402" height="500" rx="24" fill="#fff"/><text x="32" y="54" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="800" fill="#0f1f4d">Two compatible margins</text><text x="32" y="90" font-family="Inter,Arial,sans-serif" font-size="16" fill="#5a6981">At location x and time t:</text><rect x="32" y="108" width="338" height="170" rx="16" fill="#eef5ff"/><text x="201" y="150" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="20" font-weight="800" fill="#0f1f4d">M<tspan baseline-shift="sub" font-size="13">Q</tspan> = Q<tspan baseline-shift="sub" font-size="13">accept,safe</tspan> − Q<tspan baseline-shift="sub" font-size="13">incoming</tspan></text><text x="201" y="178" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#53657e">charge over the same future interval Δt</text><line x1="58" y1="197" x2="344" y2="197" stroke="#ccdaec"/><text x="201" y="229" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="20" font-weight="800" fill="#0f1f4d">M<tspan baseline-shift="sub" font-size="13">j</tspan> = j<tspan baseline-shift="sub" font-size="13">accept,crit</tspan> − j<tspan baseline-shift="sub" font-size="13">local</tspan></text><text x="201" y="257" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#53657e">local rate or flux</text>
    <text x="32" y="316" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" fill="#0f1f4d">Both margins depend on:</text>
    <g font-family="Inter,Arial,sans-serif" font-size="16" fill="#475974"><text x="32" y="350">• local SOC and particle filling</text><text x="32" y="380">• ionic and electronic transport</text><text x="32" y="410">• diffusion and interfacial kinetics</text><text x="32" y="440">• temperature, pressure and stress</text><text x="32" y="470">• wetting, contact and aging state</text></g>
  </g>
  <g transform="translate(72 716)"><rect width="288" height="18" rx="9" fill="url(#scale)"/><text x="0" y="48" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#df5a62">EXHAUSTED</text><text x="288" y="48" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#2f77dc">ROBUST</text><text x="440" y="34" font-family="Inter,Arial,sans-serif" font-size="18" fill="#52647e">Conceptual map: not a direct diagnostic image or universal numerical threshold.</text></g>
</svg>
