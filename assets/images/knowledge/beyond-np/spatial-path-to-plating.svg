<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">From nominal electrode balance to local lithium plating</title>
  <desc id="desc">A five-step pathway from nominally balanced electrodes through manufacturing variation and reaction heterogeneity to local anode saturation and lithium plating.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2a66d9"/><stop offset="1" stop-color="#44b8ff"/></linearGradient>
    <linearGradient id="risk" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f0a44b"/><stop offset="1" stop-color="#df5a62"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f1f4d" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#8fa0b9"/></marker>
  </defs>
  <rect width="1440" height="720" rx="28" fill="url(#bg)"/>
  <text x="72" y="82" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="2" fill="#2a66d9">THE SPATIAL FAILURE PATH</text>
  <text x="72" y="126" font-family="Manrope,Arial,sans-serif" font-size="34" font-weight="800" fill="#0f1f4d">A cell can be balanced on paper and unbalanced in place.</text>
  <g filter="url(#shadow)">
    <g transform="translate(62 218)"><rect width="232" height="316" rx="22" fill="#fff"/><circle cx="116" cy="68" r="34" fill="#dce9ff"/><path d="M91 68h50M116 43v50" stroke="#2a66d9" stroke-width="8" stroke-linecap="round"/><text x="116" y="138" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" fill="#2a66d9">01</text><text x="116" y="174" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="23" font-weight="800" fill="#0f1f4d">Nominally</text><text x="116" y="202" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="23" font-weight="800" fill="#0f1f4d">balanced</text><text x="116" y="246" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#586984">Average N/P and areal</text><text x="116" y="269" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#586984">capacity meet target</text></g>
    <g transform="translate(332 218)"><rect width="232" height="316" rx="22" fill="#fff"/><circle cx="116" cy="68" r="34" fill="#e5efff"/><path d="M88 77c17-35 37 21 56-18" fill="none" stroke="#2a66d9" stroke-width="8" stroke-linecap="round"/><text x="116" y="138" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" fill="#2a66d9">02</text><text x="116" y="174" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="23" font-weight="800" fill="#0f1f4d">Manufacturing</text><text x="116" y="202" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="23" font-weight="800" fill="#0f1f4d">variation</text><text x="116" y="246" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#586984">Loading, pores, wetting,</text><text x="116" y="269" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#586984">contact and pressure vary</text></g>
    <g transform="translate(602 218)"><rect width="232" height="316" rx="22" fill="#fff"/><circle cx="116" cy="68" r="34" fill="#fff0d8"/><path d="M88 83l18-32 18 27 18-13" fill="none" stroke="#eaa145" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="138" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" fill="#d7872f">03</text><text x="116" y="174" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="23" font-weight="800" fill="#0f1f4d">Reaction</text><text x="116" y="202" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="23" font-weight="800" fill="#0f1f4d">heterogeneity</text><text x="116" y="246" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#586984">Current concentrates in</text><text x="116" y="269" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#586984">a smaller active region</text></g>
    <g transform="translate(872 218)"><rect width="232" height="316" rx="22" fill="#fff"/><circle cx="116" cy="68" r="34" fill="#ffe6dd"/><path d="M91 82h50M98 69h36M106 56h20" stroke="#e66d55" stroke-width="8" stroke-linecap="round"/><text x="116" y="138" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" fill="#df634e">04</text><text x="116" y="174" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="23" font-weight="800" fill="#0f1f4d">Local margin</text><text x="116" y="202" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="23" font-weight="800" fill="#0f1f4d">is exhausted</text><text x="116" y="246" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#586984">Accessible insertion rate</text><text x="116" y="269" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#586984">falls below local Li flux</text></g>
    <g transform="translate(1142 218)"><rect width="232" height="316" rx="22" fill="#17264b"/><circle cx="116" cy="68" r="34" fill="url(#risk)"/><path d="M99 85c24-24-9-25 16-48-2 19 28 24 9 48z" fill="#fff"/><text x="116" y="138" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" fill="#ffbd7a">05</text><text x="116" y="174" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="23" font-weight="800" fill="#fff">Lithium</text><text x="116" y="202" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="23" font-weight="800" fill="#fff">plating</text><text x="116" y="246" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#c9d5ec">Anode surface potential</text><text x="116" y="269" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#c9d5ec">enters the plating regime</text></g>
  </g>
  <g stroke="#8fa0b9" stroke-width="4" marker-end="url(#arrow)"><path d="M298 376h26"/><path d="M568 376h26"/><path d="M838 376h26"/><path d="M1108 376h26"/></g>
  <rect x="62" y="590" width="1312" height="68" rx="16" fill="#0f1f4d"/>
  <text x="718" y="633" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="24" font-weight="800" fill="#fff">The global ratio sets the inventory. The local reaction field decides where the margin disappears first.</text>
</svg>
