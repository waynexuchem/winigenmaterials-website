<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">How the three Cheng electrode architectures differ through thickness</title>
  <desc id="desc">Conceptual layered electrode strips compare Uniform-90, Uniform-80, and Trapezoid-3. Uniform designs repeat the same local composition through thickness. Trapezoid-3 retains an overall 90 to 5 to 5 composition while enriching carbon and binder near both boundaries and active material in the center.</desc>
  <rect width="1440" height="760" rx="28" fill="#F4F7FB"/>

  <text x="60" y="58" font-family="Manrope,Arial,sans-serif" font-size="31" font-weight="800" fill="#0F1F4D">How the three Cheng electrode architectures differ through thickness</text>
  <text x="60" y="94" font-family="Inter,Arial,sans-serif" font-size="18" fill="#53657E">Each slice represents local composition from separator to current collector · conceptual architecture, not a quantitative reconstruction</text>

  <!-- Uniform-90 -->
  <g aria-label="Uniform-90 electrode">
    <rect x="60" y="126" width="420" height="454" rx="20" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/>
    <text x="86" y="166" font-family="Manrope,Arial,sans-serif" font-size="24" font-weight="800" fill="#17264B">Uniform-90</text>
    <text x="86" y="194" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#5A6D87">Overall composition: 90:5:5 wt.%</text>

    <text x="106" y="232" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#53657E">Separator</text>
    <text x="436" y="232" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#53657E">Current collector</text>
    <rect x="86" y="250" width="18" height="190" rx="4" fill="#DCE5F1"/>
    <rect x="436" y="250" width="18" height="190" rx="4" fill="#98A8BE"/>
    <path d="M110 238 H430" stroke="#899AB2" stroke-width="2"/>
    <path d="M422 232 L431 238 L422 244" fill="none" stroke="#899AB2" stroke-width="2"/>

    <g stroke="#FFFFFF" stroke-width="2">
      <g transform="translate(110 250)"><rect width="44" height="9" fill="#F2A94A"/><rect y="9" width="44" height="9" fill="#2A3347"/><rect y="18" width="44" height="172" fill="#467CD7"/></g>
      <g transform="translate(154 250)"><rect width="44" height="9" fill="#F2A94A"/><rect y="9" width="44" height="9" fill="#2A3347"/><rect y="18" width="44" height="172" fill="#467CD7"/></g>
      <g transform="translate(198 250)"><rect width="44" height="9" fill="#F2A94A"/><rect y="9" width="44" height="9" fill="#2A3347"/><rect y="18" width="44" height="172" fill="#467CD7"/></g>
      <g transform="translate(242 250)"><rect width="44" height="9" fill="#F2A94A"/><rect y="9" width="44" height="9" fill="#2A3347"/><rect y="18" width="44" height="172" fill="#467CD7"/></g>
      <g transform="translate(286 250)"><rect width="44" height="9" fill="#F2A94A"/><rect y="9" width="44" height="9" fill="#2A3347"/><rect y="18" width="44" height="172" fill="#467CD7"/></g>
      <g transform="translate(330 250)"><rect width="44" height="9" fill="#F2A94A"/><rect y="9" width="44" height="9" fill="#2A3347"/><rect y="18" width="44" height="172" fill="#467CD7"/></g>
      <g transform="translate(374 250)"><rect width="44" height="9" fill="#F2A94A"/><rect y="9" width="44" height="9" fill="#2A3347"/><rect y="18" width="44" height="172" fill="#467CD7"/></g>
    </g>
    <rect x="110" y="250" width="308" height="190" fill="none" stroke="#9FB0C7" stroke-width="2"/>
    <text x="264" y="470" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#53657E">Seven conceptual through-thickness slices</text>
    <text x="86" y="514" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#17264B">Same local 90:5:5 composition</text>
    <text x="86" y="538" font-family="Inter,Arial,sans-serif" font-size="17" fill="#53657E">in every layer.</text>
  </g>

  <!-- Uniform-80 -->
  <g aria-label="Uniform-80 electrode">
    <rect x="510" y="126" width="420" height="454" rx="20" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/>
    <text x="536" y="166" font-family="Manrope,Arial,sans-serif" font-size="24" font-weight="800" fill="#17264B">Uniform-80</text>
    <text x="536" y="194" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#5A6D87">Overall composition: 80:10:10 wt.%</text>

    <text x="556" y="232" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#53657E">Separator</text>
    <text x="886" y="232" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#53657E">Current collector</text>
    <rect x="536" y="250" width="18" height="190" rx="4" fill="#DCE5F1"/>
    <rect x="886" y="250" width="18" height="190" rx="4" fill="#98A8BE"/>
    <path d="M560 238 H880" stroke="#899AB2" stroke-width="2"/>
    <path d="M872 232 L881 238 L872 244" fill="none" stroke="#899AB2" stroke-width="2"/>

    <g stroke="#FFFFFF" stroke-width="2">
      <g transform="translate(560 250)"><rect width="44" height="19" fill="#F2A94A"/><rect y="19" width="44" height="19" fill="#2A3347"/><rect y="38" width="44" height="152" fill="#467CD7"/></g>
      <g transform="translate(604 250)"><rect width="44" height="19" fill="#F2A94A"/><rect y="19" width="44" height="19" fill="#2A3347"/><rect y="38" width="44" height="152" fill="#467CD7"/></g>
      <g transform="translate(648 250)"><rect width="44" height="19" fill="#F2A94A"/><rect y="19" width="44" height="19" fill="#2A3347"/><rect y="38" width="44" height="152" fill="#467CD7"/></g>
      <g transform="translate(692 250)"><rect width="44" height="19" fill="#F2A94A"/><rect y="19" width="44" height="19" fill="#2A3347"/><rect y="38" width="44" height="152" fill="#467CD7"/></g>
      <g transform="translate(736 250)"><rect width="44" height="19" fill="#F2A94A"/><rect y="19" width="44" height="19" fill="#2A3347"/><rect y="38" width="44" height="152" fill="#467CD7"/></g>
      <g transform="translate(780 250)"><rect width="44" height="19" fill="#F2A94A"/><rect y="19" width="44" height="19" fill="#2A3347"/><rect y="38" width="44" height="152" fill="#467CD7"/></g>
      <g transform="translate(824 250)"><rect width="44" height="19" fill="#F2A94A"/><rect y="19" width="44" height="19" fill="#2A3347"/><rect y="38" width="44" height="152" fill="#467CD7"/></g>
    </g>
    <rect x="560" y="250" width="308" height="190" fill="none" stroke="#9FB0C7" stroke-width="2"/>
    <text x="714" y="470" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#53657E">Seven conceptual through-thickness slices</text>
    <text x="536" y="514" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#17264B">Same local 80:10:10 composition;</text>
    <text x="536" y="538" font-family="Inter,Arial,sans-serif" font-size="17" fill="#53657E">more carbon and binder throughout.</text>
  </g>

  <!-- Trapezoid-3 -->
  <g aria-label="Trapezoid-3 electrode">
    <rect x="960" y="126" width="420" height="454" rx="20" fill="#FFFFFF" stroke="#9FBAE9" stroke-width="2"/>
    <text x="986" y="166" font-family="Manrope,Arial,sans-serif" font-size="24" font-weight="800" fill="#17264B">Trapezoid-3</text>
    <text x="986" y="194" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#315FAD">Overall composition: 90:5:5 wt.%</text>

    <text x="1006" y="232" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#53657E">Separator</text>
    <text x="1336" y="232" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#53657E">Current collector</text>
    <rect x="986" y="250" width="18" height="190" rx="4" fill="#DCE5F1"/>
    <rect x="1336" y="250" width="18" height="190" rx="4" fill="#98A8BE"/>
    <path d="M1010 238 H1330" stroke="#899AB2" stroke-width="2"/>
    <path d="M1322 232 L1331 238 L1322 244" fill="none" stroke="#899AB2" stroke-width="2"/>

    <g stroke="#FFFFFF" stroke-width="2">
      <g transform="translate(1010 250)"><rect width="44" height="13" fill="#F2A94A"/><rect y="13" width="44" height="13" fill="#2A3347"/><rect y="26" width="44" height="164" fill="#467CD7"/></g>
      <g transform="translate(1054 250)"><rect width="44" height="11" fill="#F2A94A"/><rect y="11" width="44" height="11" fill="#2A3347"/><rect y="22" width="44" height="168" fill="#467CD7"/></g>
      <g transform="translate(1098 250)"><rect width="44" height="7" fill="#F2A94A"/><rect y="7" width="44" height="7" fill="#2A3347"/><rect y="14" width="44" height="176" fill="#467CD7"/></g>
      <g transform="translate(1142 250)"><rect width="44" height="4" fill="#F2A94A"/><rect y="4" width="44" height="4" fill="#2A3347"/><rect y="8" width="44" height="182" fill="#467CD7"/></g>
      <g transform="translate(1186 250)"><rect width="44" height="7" fill="#F2A94A"/><rect y="7" width="44" height="7" fill="#2A3347"/><rect y="14" width="44" height="176" fill="#467CD7"/></g>
      <g transform="translate(1230 250)"><rect width="44" height="11" fill="#F2A94A"/><rect y="11" width="44" height="11" fill="#2A3347"/><rect y="22" width="44" height="168" fill="#467CD7"/></g>
      <g transform="translate(1274 250)"><rect width="44" height="13" fill="#F2A94A"/><rect y="13" width="44" height="13" fill="#2A3347"/><rect y="26" width="44" height="164" fill="#467CD7"/></g>
    </g>
    <rect x="1010" y="250" width="308" height="190" fill="none" stroke="#7598D3" stroke-width="2"/>
    <text x="1164" y="470" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#53657E">Boundary enrichment ↔ active-rich center</text>
    <text x="986" y="514" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#17264B">Same overall 90:5:5 as Uniform-90;</text>
    <text x="986" y="538" font-family="Inter,Arial,sans-serif" font-size="17" fill="#53657E">carbon + binder shift toward both boundaries.</text>
  </g>

  <!-- Legend and controlled comparison -->
  <g font-family="Inter,Arial,sans-serif">
    <rect x="80" y="612" width="20" height="20" rx="4" fill="#467CD7"/><text x="112" y="628" font-size="16" font-weight="700" fill="#24344E">Active material</text>
    <rect x="242" y="612" width="20" height="20" rx="4" fill="#2A3347"/><text x="274" y="628" font-size="16" font-weight="700" fill="#24344E">Carbon</text>
    <rect x="362" y="612" width="20" height="20" rx="4" fill="#F2A94A"/><text x="394" y="628" font-size="16" font-weight="700" fill="#24344E">Binder</text>
    <text x="520" y="628" font-size="16" fill="#53657E">Boundary enrichment modifies local electronic conductivity, adhesion, and reaction accessibility.</text>

    <rect x="60" y="662" width="646" height="60" rx="14" fill="#EAF2FF"/>
    <text x="84" y="688" font-size="15" font-weight="800" fill="#214F98">HELD APPROXIMATELY CONSTANT</text>
    <text x="84" y="710" font-size="15" fill="#40536E">Total mass, thickness, and overall porosity; U90 vs T3 also share total 90:5:5 composition.</text>

    <rect x="734" y="662" width="646" height="60" rx="14" fill="#FFF4E5"/>
    <text x="758" y="688" font-size="15" font-weight="800" fill="#9B5D13">CHANGED</text>
    <text x="758" y="710" font-size="15" fill="#40536E">Through-thickness placement of active material, carbon, and binder.</text>

    <text x="720" y="746" text-anchor="middle" font-size="14" font-weight="700" fill="#62748D">“Trapezoid” describes the active-material concentration profile—not the physical electrode shape.</text>
  </g>
</svg>
