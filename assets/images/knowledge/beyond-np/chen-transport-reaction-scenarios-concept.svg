<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">How Ionic and Electronic Transport Shape Through-Thickness Reaction in a Porous Electrode</title>
  <desc id="desc">Four scenario columns compare weak ionic conduction, weak electronic conduction, both weak, and both strong. Each column shows a physical electrode schematic, relative local reaction rate, and relative ionic current in the electrolyte.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#10244a" flood-opacity=".10"/></filter>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}.display{font-family:Manrope,Arial,sans-serif}.navy{fill:#0f1f4d}.muted{fill:#53657e}.axis{stroke:#718198;stroke-width:2}.grid{stroke:#dce4ef;stroke-width:1}.interface{stroke:#7c8ca3;stroke-width:2;stroke-dasharray:7 6}.region{font-family:Inter,Arial,sans-serif;font-size:20px;fill:#667991}.tick{font-family:Inter,Arial,sans-serif;font-size:19px;fill:#53657e}.plot-title{font-family:Manrope,Arial,sans-serif;font-size:23px;font-weight:800;fill:#17264b}.column-title{font-family:Manrope,Arial,sans-serif;font-size:24px;font-weight:800;fill:#0f1f4d}.interp{font-family:Manrope,Arial,sans-serif;font-size:22px;font-weight:800}.curve{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1800" height="1320" rx="30" fill="#f4f7fb"/>
  <text x="60" y="60" class="display navy" font-size="38" font-weight="800">How Ionic and Electronic Transport Shape Through-Thickness Reaction in a Porous Electrode</text>
  <text x="60" y="101" class="sans muted" font-size="22">Conceptual limiting profiles adapted from Chen et al.; curves are qualitative and are not digitized source data.</text>

  <g transform="translate(60 122)">
    <rect width="1680" height="76" rx="18" fill="#e8f1ff" stroke="#c9dbf7"/>
    <text x="840" y="31" text-anchor="middle" class="display navy" font-size="24" font-weight="800">A steep decrease in electrolyte ionic current identifies where ionic current is transferred into local electrochemical reaction.</text>
    <text x="840" y="61" text-anchor="middle" class="sans muted" font-size="21">Where i<tspan baseline-shift="sub" font-size="15">2</tspan> falls steeply, j<tspan baseline-shift="sub" font-size="15">C</tspan> is high; where i<tspan baseline-shift="sub" font-size="15">2</tspan> is nearly flat, little reaction occurs.</text>
  </g>

  <!-- Scenario 1 -->
  <g transform="translate(30 224)" filter="url(#shadow)">
    <rect width="405" height="960" rx="22" fill="#fff" stroke="#f1c794"/>
    <text x="202.5" y="38" text-anchor="middle" class="column-title">(i) Weak ionic conduction</text>
    <text x="202.5" y="67" text-anchor="middle" class="interp" fill="#d86d1f">Reaction concentrated<tspan x="202.5" dy="25">near separator</tspan></text>
    <g transform="translate(22 108)">
      <rect x="0" y="0" width="94" height="82" rx="10" fill="#e8edf4"/><rect x="94" y="0" width="246" height="82" fill="#fff7ee" stroke="#ead8c3"/><rect x="340" y="0" width="20" height="82" rx="4" fill="#9eacc0"/>
      <rect x="94" y="7" width="40" height="68" rx="7" fill="#ee9145" opacity=".65"/>
      <text x="47" y="19" text-anchor="middle" class="region" font-size="16">Separator<tspan x="47" dy="18" font-size="14">no active</tspan><tspan x="47" dy="16" font-size="14">material</tspan></text><text x="217" y="29" text-anchor="middle" class="region">Porous electrode</text><text x="350" y="101" text-anchor="middle" class="region">CC</text>
      <path d="M16 64H84" stroke="#2a66d9" stroke-width="4"/><path d="M84 64l-12-7v14z" fill="#2a66d9"/><text x="50" y="80" text-anchor="middle" class="sans" font-size="17" font-weight="800" fill="#2a66d9">Li<tspan baseline-shift="super" font-size="12">+</tspan></text>
      <path d="M344 64H276" stroke="#17264b" stroke-width="4"/><path d="M276 64l12-7v14z" fill="#17264b"/><text x="316" y="80" text-anchor="middle" class="sans" font-size="17" font-weight="800" fill="#17264b">e<tspan baseline-shift="super" font-size="12">−</tspan></text>
    </g>
    <g transform="translate(42 245)">
      <text x="0" y="0" class="plot-title">Relative local reaction rate, j<tspan baseline-shift="sub" font-size="13">C</tspan></text>
      <rect x="0" y="20" width="94" height="190" fill="#eef2f7"/><rect x="94" y="20" width="266" height="190" fill="#fff"/>
      <line x1="0" y1="210" x2="360" y2="210" class="axis"/><line x1="0" y1="20" x2="0" y2="210" class="axis"/><line x1="94" y1="20" x2="94" y2="210" class="interface"/>
      <text x="47" y="38" text-anchor="middle" class="region" font-size="16">Separator<tspan x="47" dy="17" font-size="14">no active</tspan><tspan x="47" dy="15" font-size="14">material</tspan></text><text x="227" y="42" text-anchor="middle" class="region">Porous electrode</text>
      <path d="M94 55 C108 126 118 190 170 206 C230 210 290 210 360 210" class="curve" stroke="#e87928"/>
      <text x="-6" y="38" text-anchor="end" class="tick" font-weight="800">high</text><text x="-6" y="207" text-anchor="end" class="tick">0</text>
    </g>
    <g transform="translate(22 535)">
      <text x="0" y="0" class="plot-title">Relative ionic current, i<tspan baseline-shift="sub" font-size="13">2</tspan></text>
      <rect x="0" y="20" width="94" height="190" fill="#eef2f7"/><rect x="94" y="20" width="266" height="190" fill="#fff"/>
      <line x1="0" y1="210" x2="360" y2="210" class="axis"/><line x1="0" y1="20" x2="0" y2="210" class="axis"/><line x1="94" y1="20" x2="94" y2="210" class="interface"/>
      <path d="M94 28 C106 92 118 183 170 204 C230 209 295 210 360 210" class="curve" stroke="#e87928"/>
      <text x="-9" y="31" text-anchor="end" class="tick">1</text><text x="-9" y="210" text-anchor="end" class="tick">0</text>
      <text x="0" y="231" class="tick">0</text><text x="94" y="231" text-anchor="middle" class="tick">0.26</text><text x="360" y="231" text-anchor="end" class="tick">1</text><text x="180" y="257" text-anchor="middle" class="sans muted" font-size="14">Normalized position</text>
    </g>
    <text x="202.5" y="890" text-anchor="middle" class="sans muted" font-size="20">Ions react soon after entering;</text><text x="202.5" y="918" text-anchor="middle" class="sans muted" font-size="20">deeper regions are underused.</text>
  </g>

  <!-- Scenario 2 -->
  <g transform="translate(475 224)" filter="url(#shadow)">
    <rect width="405" height="960" rx="22" fill="#fff" stroke="#e9d69b"/>
    <text x="202.5" y="38" text-anchor="middle" class="column-title">(ii) Weak electronic conduction</text>
    <text x="202.5" y="67" text-anchor="middle" class="interp" fill="#b88900">Reaction concentrated<tspan x="202.5" dy="25">near current collector</tspan></text>
    <g transform="translate(22 108)">
      <rect x="0" y="0" width="94" height="82" rx="10" fill="#e8edf4"/><rect x="94" y="0" width="246" height="82" fill="#fffbed" stroke="#e7dec0"/><rect x="340" y="0" width="20" height="82" rx="4" fill="#9eacc0"/>
      <rect x="304" y="7" width="36" height="68" rx="7" fill="#e2b323" opacity=".68"/>
      <text x="47" y="19" text-anchor="middle" class="region" font-size="16">Separator<tspan x="47" dy="18" font-size="14">no active</tspan><tspan x="47" dy="16" font-size="14">material</tspan></text><text x="217" y="29" text-anchor="middle" class="region">Porous electrode</text><text x="350" y="101" text-anchor="middle" class="region">CC</text>
      <path d="M16 64H84" stroke="#2a66d9" stroke-width="4"/><path d="M84 64l-12-7v14z" fill="#2a66d9"/><text x="50" y="80" text-anchor="middle" class="sans" font-size="17" font-weight="800" fill="#2a66d9">Li<tspan baseline-shift="super" font-size="12">+</tspan></text>
      <path d="M344 64H276" stroke="#17264b" stroke-width="4"/><path d="M276 64l12-7v14z" fill="#17264b"/><text x="316" y="80" text-anchor="middle" class="sans" font-size="17" font-weight="800" fill="#17264b">e<tspan baseline-shift="super" font-size="12">−</tspan></text>
    </g>
    <g transform="translate(42 245)">
      <text x="0" y="0" class="plot-title">Relative local reaction rate, j<tspan baseline-shift="sub" font-size="13">C</tspan></text>
      <rect x="0" y="20" width="94" height="190" fill="#eef2f7"/><rect x="94" y="20" width="266" height="190" fill="#fff"/>
      <line x1="0" y1="210" x2="360" y2="210" class="axis"/><line x1="0" y1="20" x2="0" y2="210" class="axis"/><line x1="94" y1="20" x2="94" y2="210" class="interface"/>
      <text x="47" y="38" text-anchor="middle" class="region" font-size="16">Separator<tspan x="47" dy="17" font-size="14">no active</tspan><tspan x="47" dy="15" font-size="14">material</tspan></text><text x="227" y="42" text-anchor="middle" class="region">Porous electrode</text>
      <path d="M94 210 C220 210 300 210 334 190 C350 172 357 96 360 55" class="curve" stroke="#d9a600"/>
      <text x="-6" y="38" text-anchor="end" class="tick" font-weight="800">high</text><text x="-6" y="207" text-anchor="end" class="tick">0</text>
    </g>
    <g transform="translate(22 535)">
      <text x="0" y="0" class="plot-title">Relative ionic current, i<tspan baseline-shift="sub" font-size="13">2</tspan></text>
      <rect x="0" y="20" width="94" height="190" fill="#eef2f7"/><rect x="94" y="20" width="266" height="190" fill="#fff"/>
      <line x1="0" y1="210" x2="360" y2="210" class="axis"/><line x1="0" y1="20" x2="0" y2="210" class="axis"/><line x1="94" y1="20" x2="94" y2="210" class="interface"/>
      <path d="M94 28 C210 28 300 28 334 46 C351 75 358 158 360 210" class="curve" stroke="#d9a600"/>
      <text x="-9" y="31" text-anchor="end" class="tick">1</text><text x="-9" y="210" text-anchor="end" class="tick">0</text>
      <text x="0" y="231" class="tick">0</text><text x="94" y="231" text-anchor="middle" class="tick">0.26</text><text x="360" y="231" text-anchor="end" class="tick">1</text><text x="180" y="257" text-anchor="middle" class="sans muted" font-size="14">Normalized position</text>
    </g>
    <text x="202.5" y="890" text-anchor="middle" class="sans muted" font-size="20">Ions penetrate deeply; reaction concentrates</text><text x="202.5" y="918" text-anchor="middle" class="sans muted" font-size="20">where electrons are accessible.</text>
  </g>

  <!-- Scenario 3 -->
  <g transform="translate(920 224)" filter="url(#shadow)">
    <rect width="405" height="960" rx="22" fill="#fff" stroke="#bfd1f3"/>
    <text x="202.5" y="38" text-anchor="middle" class="column-title">(iii) Both weak</text>
    <text x="202.5" y="67" text-anchor="middle" class="interp" fill="#2a66d9">Reaction concentrated<tspan x="202.5" dy="25">near both boundaries</tspan></text>
    <g transform="translate(22 108)">
      <rect x="0" y="0" width="94" height="82" rx="10" fill="#e8edf4"/><rect x="94" y="0" width="246" height="82" fill="#f5f8ff" stroke="#d5e0f4"/><rect x="340" y="0" width="20" height="82" rx="4" fill="#9eacc0"/>
      <rect x="94" y="7" width="54" height="68" rx="7" fill="#4f82df" opacity=".62"/><rect x="286" y="7" width="54" height="68" rx="7" fill="#4f82df" opacity=".62"/>
      <text x="47" y="19" text-anchor="middle" class="region" font-size="16">Separator<tspan x="47" dy="18" font-size="14">no active</tspan><tspan x="47" dy="16" font-size="14">material</tspan></text><text x="217" y="29" text-anchor="middle" class="region">Porous electrode</text><text x="350" y="101" text-anchor="middle" class="region">CC</text>
      <path d="M16 64H84" stroke="#2a66d9" stroke-width="4"/><path d="M84 64l-12-7v14z" fill="#2a66d9"/><text x="50" y="80" text-anchor="middle" class="sans" font-size="17" font-weight="800" fill="#2a66d9">Li<tspan baseline-shift="super" font-size="12">+</tspan></text>
      <path d="M344 64H276" stroke="#17264b" stroke-width="4"/><path d="M276 64l12-7v14z" fill="#17264b"/><text x="316" y="80" text-anchor="middle" class="sans" font-size="17" font-weight="800" fill="#17264b">e<tspan baseline-shift="super" font-size="12">−</tspan></text>
    </g>
    <g transform="translate(42 245)">
      <text x="0" y="0" class="plot-title">Relative local reaction rate, j<tspan baseline-shift="sub" font-size="13">C</tspan></text>
      <rect x="0" y="20" width="94" height="190" fill="#eef2f7"/><rect x="94" y="20" width="266" height="190" fill="#fff"/>
      <line x1="0" y1="210" x2="360" y2="210" class="axis"/><line x1="0" y1="20" x2="0" y2="210" class="axis"/><line x1="94" y1="20" x2="94" y2="210" class="interface"/>
      <text x="47" y="38" text-anchor="middle" class="region" font-size="16">Separator<tspan x="47" dy="17" font-size="14">no active</tspan><tspan x="47" dy="15" font-size="14">material</tspan></text><text x="227" y="42" text-anchor="middle" class="region">Porous electrode</text>
      <path d="M94 78 C112 158 140 202 205 206 C276 206 330 182 360 62" class="curve" stroke="#2a66d9"/>
      <text x="-6" y="38" text-anchor="end" class="tick" font-weight="800">high</text><text x="-6" y="207" text-anchor="end" class="tick">0</text>
    </g>
    <g transform="translate(22 535)">
      <text x="0" y="0" class="plot-title">Relative ionic current, i<tspan baseline-shift="sub" font-size="13">2</tspan></text>
      <rect x="0" y="20" width="94" height="190" fill="#eef2f7"/><rect x="94" y="20" width="266" height="190" fill="#fff"/>
      <line x1="0" y1="210" x2="360" y2="210" class="axis"/><line x1="0" y1="20" x2="0" y2="210" class="axis"/><line x1="94" y1="20" x2="94" y2="210" class="interface"/>
      <path d="M94 28 C110 71 128 88 158 91 C225 92 287 92 318 108 C342 131 354 179 360 210" class="curve" stroke="#2a66d9"/>
      <text x="-9" y="31" text-anchor="end" class="tick">1</text><text x="-9" y="210" text-anchor="end" class="tick">0</text>
      <text x="0" y="231" class="tick">0</text><text x="94" y="231" text-anchor="middle" class="tick">0.26</text><text x="360" y="231" text-anchor="end" class="tick">1</text><text x="180" y="257" text-anchor="middle" class="sans muted" font-size="14">Normalized position</text>
    </g>
    <text x="202.5" y="890" text-anchor="middle" class="sans muted" font-size="20">Reaction is concentrated at both edges;</text><text x="202.5" y="918" text-anchor="middle" class="sans muted" font-size="20">the middle remains underused.</text>
  </g>

  <!-- Scenario 4 -->
  <g transform="translate(1365 224)" filter="url(#shadow)">
    <rect width="405" height="960" rx="22" fill="#fff" stroke="#d4c5e8"/>
    <text x="202.5" y="38" text-anchor="middle" class="column-title">(iv) Both strong</text>
    <text x="202.5" y="67" text-anchor="middle" class="interp" fill="#7b3f98">Reaction distributed<tspan x="202.5" dy="25">approximately uniformly</tspan></text>
    <g transform="translate(22 108)">
      <rect x="0" y="0" width="94" height="82" rx="10" fill="#e8edf4"/><rect x="94" y="0" width="246" height="82" fill="#faf6ff" stroke="#e1d7ed"/><rect x="340" y="0" width="20" height="82" rx="4" fill="#9eacc0"/>
      <rect x="94" y="7" width="246" height="68" rx="7" fill="#9361ad" opacity=".35"/>
      <text x="47" y="19" text-anchor="middle" class="region" font-size="16">Separator<tspan x="47" dy="18" font-size="14">no active</tspan><tspan x="47" dy="16" font-size="14">material</tspan></text><text x="217" y="29" text-anchor="middle" class="region">Porous electrode</text><text x="350" y="101" text-anchor="middle" class="region">CC</text>
      <path d="M16 64H84" stroke="#2a66d9" stroke-width="4"/><path d="M84 64l-12-7v14z" fill="#2a66d9"/><text x="50" y="80" text-anchor="middle" class="sans" font-size="17" font-weight="800" fill="#2a66d9">Li<tspan baseline-shift="super" font-size="12">+</tspan></text>
      <path d="M344 64H276" stroke="#17264b" stroke-width="4"/><path d="M276 64l12-7v14z" fill="#17264b"/><text x="316" y="80" text-anchor="middle" class="sans" font-size="17" font-weight="800" fill="#17264b">e<tspan baseline-shift="super" font-size="12">−</tspan></text>
    </g>
    <g transform="translate(42 245)">
      <text x="0" y="0" class="plot-title">Relative local reaction rate, j<tspan baseline-shift="sub" font-size="13">C</tspan></text>
      <rect x="0" y="20" width="94" height="190" fill="#eef2f7"/><rect x="94" y="20" width="266" height="190" fill="#fff"/>
      <line x1="0" y1="210" x2="360" y2="210" class="axis"/><line x1="0" y1="20" x2="0" y2="210" class="axis"/><line x1="94" y1="20" x2="94" y2="210" class="interface"/>
      <text x="47" y="38" text-anchor="middle" class="region" font-size="16">Separator<tspan x="47" dy="17" font-size="14">no active</tspan><tspan x="47" dy="15" font-size="14">material</tspan></text><text x="227" y="42" text-anchor="middle" class="region">Porous electrode</text>
      <path d="M94 142 L360 142" class="curve" stroke="#7b3f98"/>
      <text x="227" y="126" text-anchor="middle" class="sans" font-size="15" font-weight="800" fill="#7b3f98">constant j<tspan baseline-shift="sub" font-size="11">C</tspan></text>
      <text x="-6" y="38" text-anchor="end" class="tick" font-weight="800">high</text><text x="-6" y="207" text-anchor="end" class="tick">0</text>
    </g>
    <g transform="translate(22 535)">
      <text x="0" y="0" class="plot-title">Relative ionic current, i<tspan baseline-shift="sub" font-size="13">2</tspan></text>
      <rect x="0" y="20" width="94" height="190" fill="#eef2f7"/><rect x="94" y="20" width="266" height="190" fill="#fff"/>
      <line x1="0" y1="210" x2="360" y2="210" class="axis"/><line x1="0" y1="20" x2="0" y2="210" class="axis"/><line x1="94" y1="20" x2="94" y2="210" class="interface"/>
      <path d="M94 28 L360 210" class="curve" stroke="#7b3f98"/>
      <text x="-9" y="31" text-anchor="end" class="tick">1</text><text x="-9" y="210" text-anchor="end" class="tick">0</text>
      <text x="0" y="231" class="tick">0</text><text x="94" y="231" text-anchor="middle" class="tick">0.26</text><text x="360" y="231" text-anchor="end" class="tick">1</text><text x="180" y="257" text-anchor="middle" class="sans muted" font-size="14">Normalized position</text>
    </g>
    <text x="202.5" y="890" text-anchor="middle" class="sans muted" font-size="20">Equal ionic-current loss per slice means</text><text x="202.5" y="918" text-anchor="middle" class="sans muted" font-size="20">similar reaction throughout the electrode.</text>
  </g>

  <g transform="translate(60 1230)">
    <text x="0" y="8" class="sans muted" font-size="21"><tspan font-weight="800" fill="#17264b">Orientation:</tspan> Li<tspan baseline-shift="super" font-size="15">+</tspan> enters from the separator; electrons are supplied from the current collector. The dashed line marks the separator/electrode interface at x = 0.26.</text>
    <text x="0" y="48" class="sans muted" font-size="21"><tspan font-weight="800" fill="#17264b">Interpretation:</tspan> The separator contains no active material. Curves are qualitative, scenario-specific profiles and should not be compared by absolute height.</text>
  </g>
</svg>
