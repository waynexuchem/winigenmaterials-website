<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">Reaction uniformity is condition dependent</title><desc id="d">The same electrode shows different reaction profiles at low rate, fast charge, low temperature, and after aging.</desc>
<rect width="1200" height="560" fill="#f5f8fc"/><text x="60" y="66" font-family="Inter,Arial" font-size="34" font-weight="800" fill="#14213d">The optimum is an operating-window problem</text><text x="60" y="100" font-family="Inter,Arial" font-size="17" fill="#53627c">The same spatial design does not produce the same reaction field at every rate, temperature, SOC, or age.</text>
<g font-family="Inter,Arial">
<g transform="translate(60 145)"><rect width="255" height="340" rx="22" fill="#fff" stroke="#d5deeb"/><text x="24" y="42" font-size="20" font-weight="800" fill="#14213d">Low-rate discharge</text><text x="24" y="69" font-size="14" fill="#53627c">Weak transport polarization</text><rect x="25" y="105" width="205" height="105" rx="10" fill="#dce8fa"/><path d="M25 165c40-4 55-9 92-6s67-3 113-7" fill="none" stroke="#2a66d9" stroke-width="12"/><text x="25" y="251" font-size="15" font-weight="700" fill="#2a66d9">Relatively flat</text><text x="25" y="280" font-size="13" fill="#53627c">Gradient benefit may be small</text></g>
<g transform="translate(335 145)"><rect width="255" height="340" rx="22" fill="#fff" stroke="#d5deeb"/><text x="24" y="42" font-size="20" font-weight="800" fill="#14213d">Fast charge</text><text x="24" y="69" font-size="14" fill="#53627c">Ionic access becomes limiting</text><rect x="25" y="105" width="205" height="105" rx="10" fill="#dce8fa"/><path d="M25 194c73 0 125-11 205-76" fill="none" stroke="#ed6a4b" stroke-width="12"/><text x="25" y="251" font-size="15" font-weight="700" fill="#c25e27">Separator-side concentration</text><text x="25" y="280" font-size="13" fill="#53627c">Plating margin can narrow locally</text></g>
<g transform="translate(610 145)"><rect width="255" height="340" rx="22" fill="#fff" stroke="#d5deeb"/><text x="24" y="42" font-size="20" font-weight="800" fill="#14213d">Low temperature</text><text x="24" y="69" font-size="14" fill="#53627c">Kinetics and transport both slow</text><rect x="25" y="105" width="205" height="105" rx="10" fill="#dce8fa"/><path d="M25 199c103 0 143-18 205-91" fill="none" stroke="#c72f56" stroke-width="12"/><text x="25" y="251" font-size="15" font-weight="700" fill="#c72f56">Stronger localization</text><text x="25" y="280" font-size="13" fill="#53627c">A room-temperature optimum shifts</text></g>
<g transform="translate(885 145)"><rect width="255" height="340" rx="22" fill="#fff" stroke="#d5deeb"/><text x="24" y="42" font-size="20" font-weight="800" fill="#14213d">Aged electrode</text><text x="24" y="69" font-size="14" fill="#53627c">Impedance map has evolved</text><rect x="25" y="105" width="205" height="105" rx="10" fill="#dce8fa"/><path d="M25 173c32-58 50 42 83-6s47 38 76-18 35 23 46-20" fill="none" stroke="#7a4ca5" stroke-width="12"/><text x="25" y="251" font-size="15" font-weight="700" fill="#7a4ca5">Migrating hot spots</text><text x="25" y="280" font-size="13" fill="#53627c">BOL uniformity is not permanent</text></g>
</g></svg>
