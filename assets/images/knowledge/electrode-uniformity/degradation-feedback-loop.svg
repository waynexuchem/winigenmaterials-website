<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Reaction heterogeneity and degradation form a feedback loop</title>
<desc id="desc">A five-stage loop connects a local reaction hotspot to heat and stress, interphase or structural damage, impedance change, current redistribution, and a migrating hotspot.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#5d7192"/></marker><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#14213d" flood-opacity=".13"/></filter><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef3fa"/></linearGradient></defs>
<rect width="1200" height="620" fill="url(#bg)"/><text x="60" y="62" font-family="Inter,Arial" font-size="34" font-weight="800" fill="#14213d">A reaction field evolves into a degradation field</text><text x="60" y="96" font-family="Inter,Arial" font-size="17" fill="#53627c">Damage changes local impedance, so the next hotspot need not remain where the first one formed.</text>
<g fill="none" stroke="#5d7192" stroke-width="4" marker-end="url(#arrow)"><path d="M334 212C420 132 510 123 575 161"/><path d="M760 208c64 23 101 70 100 124"/><path d="M796 443c-68 48-143 57-205 32"/><path d="M430 461c-69-7-125-43-150-96"/><path d="M244 262c7-48 29-84 65-108"/></g>
<g filter="url(#s)" font-family="Inter,Arial">
 <g><rect x="76" y="160" width="270" height="126" rx="20" fill="#fff" stroke="#f19b72"/><circle cx="111" cy="196" r="17" fill="#ec6d46"/><text x="111" y="202" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">1</text><text x="139" y="199" font-size="19" font-weight="800" fill="#14213d">Local reaction hotspot</text><text x="105" y="235" font-size="14" fill="#53627c">Higher local current or utilization</text><text x="105" y="257" font-size="14" fill="#53627c">than surrounding material</text></g>
 <g><rect x="470" y="115" width="300" height="126" rx="20" fill="#fff" stroke="#f1bc64"/><circle cx="505" cy="151" r="17" fill="#db942d"/><text x="505" y="157" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">2</text><text x="533" y="154" font-size="19" font-weight="800" fill="#14213d">Heat and stress rise</text><text x="499" y="190" font-size="14" fill="#53627c">Polarization, expansion, pressure,</text><text x="499" y="212" font-size="14" fill="#53627c">and side-reaction demand increase</text></g>
 <g><rect x="850" y="270" width="285" height="132" rx="20" fill="#fff" stroke="#bf92cb"/><circle cx="885" cy="307" r="17" fill="#8c55a0"/><text x="885" y="313" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">3</text><text x="913" y="310" font-size="19" font-weight="800" fill="#14213d">Local damage develops</text><text x="879" y="346" font-size="14" fill="#53627c">SEI/CEI growth, plating, cracking,</text><text x="879" y="368" font-size="14" fill="#53627c">pore change, or contact loss</text></g>
 <g><rect x="492" y="420" width="310" height="126" rx="20" fill="#fff" stroke="#75a6e7"/><circle cx="527" cy="456" r="17" fill="#2a66d9"/><text x="527" y="462" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">4</text><text x="555" y="459" font-size="19" font-weight="800" fill="#14213d">Impedance map changes</text><text x="521" y="495" font-size="14" fill="#53627c">Transport, kinetics, active area, and</text><text x="521" y="517" font-size="14" fill="#53627c">electronic contact become less uniform</text></g>
 <g><rect x="98" y="350" width="300" height="132" rx="20" fill="#fff" stroke="#67b9aa"/><circle cx="133" cy="387" r="17" fill="#258c7d"/><text x="133" y="393" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">5</text><text x="161" y="390" font-size="19" font-weight="800" fill="#14213d">Current redistributes</text><text x="127" y="426" font-size="14" fill="#53627c">The hotspot can intensify, spread, or</text><text x="127" y="448" font-size="14" fill="#53627c">migrate into lower-impedance neighbors</text></g>
</g>
<text x="600" y="588" text-anchor="middle" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#53627c">Instantaneous uniformity is not lifetime uniformity.</text>
</svg>
