<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#12305d">
  <title>Checkout Not Completed | Winigen Materials</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>.checkout-result { min-height:100vh; display:grid; place-items:center; padding:48px 20px; background:#f6f9fc; } .checkout-result__panel { width:min(620px,100%); background:#fff; border:1px solid #cbd7e5; border-top:4px solid #1c6f99; border-radius:6px; padding:38px; } .checkout-result__mode { color:#9a6522; font-size:12px; font-weight:800; letter-spacing:0; text-transform:uppercase; } .checkout-result h1 { color:#142d4c; margin:12px 0; } .checkout-result p { color:#566a82; line-height:1.6; } .checkout-result__actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; } @media (max-width:600px) { .checkout-result__panel { padding:28px 22px; } .checkout-result__actions .btn { width:100%; text-align:center; } }</style>
</head>
<body>
  <main class="checkout-result">
    <section class="checkout-result__panel" aria-labelledby="checkout-cancel-title">
      <p class="checkout-result__mode">Test Mode</p>
      <h1 id="checkout-cancel-title">Checkout was not completed.</h1>
      <p>No payment was processed. Your cart remains available so you can review it or continue browsing materials.</p>
      <div class="checkout-result__actions"><a class="btn" href="/cart.html">Return to Cart</a><a class="btn secondary" href="/products.html">Continue Shopping</a></div>
    </section>
  </main>
</body>
</html>
